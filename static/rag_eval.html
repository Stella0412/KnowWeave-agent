<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知序 · RAG 评估</title>
<style>
  :root {
    --brand: #ff6f3c;
    --brand-2: #ff9a5a;
    --bg: #fff7f0;
    --panel: #ffffff;
    --ink: #3a3a3a;
    --muted: #9b9b9b;
    --border: #f0e6dd;
    --ok: #2f9e63;
    --ok-bg: #eaf7f0;
    --bad: #d64545;
    --bad-bg: #fdeeee;
    --warn: #b7791f;
    --warn-bg: #fdf3e2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
  }
  .page { max-width: 1180px; margin: 0 auto; padding: 0 20px 60px; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
    padding: 18px 22px; margin: 18px 0 16px;
    border-radius: 14px;
    background: linear-gradient(135deg, #ff6f3c, #ff8a5a);
    color: #fff;
    box-shadow: 0 8px 30px rgba(255, 111, 60, 0.16);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .logo {
    width: 46px; height: 46px; border-radius: 13px;
    background: rgba(255,255,255,0.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 25px;
  }
  .brand h1 { font-size: 20px; font-weight: 650; }
  .brand p { font-size: 12.5px; opacity: .9; margin-top: 2px; }
  .ghost {
    color: #fff; text-decoration: none; font-size: 13px;
    border: 1px solid rgba(255,255,255,.6);
    background: rgba(255,255,255,.14);
    padding: 7px 14px; border-radius: 20px;
  }
  .ghost:hover { background: rgba(255,255,255,.28); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 15px; font-weight: 650;
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 4px;
  }
  .card .sub { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }

  /* 控制区 */
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 13px; cursor: pointer;
    border-radius: 9px; padding: 8px 15px;
    border: 1px solid var(--brand);
    background: var(--brand); color: #fff;
    transition: filter .15s, opacity .15s;
  }
  button.secondary { background: #fff; color: var(--brand); }
  button:hover { filter: brightness(1.05); }
  button:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  .run-state { font-size: 12.5px; color: var(--muted); margin-left: auto; }
  .run-state.running { color: var(--brand); }
  .run-state.error { color: var(--bad); }
  .progress {
    width: 100%; height: 7px; border-radius: 99px;
    background: #f6ece4; overflow: hidden; margin-top: 12px;
    display: none;
  }
  .progress.show { display: block; }
  .progress .bar {
    height: 100%; width: 0;
    background: linear-gradient(90deg, var(--brand), var(--brand-2));
    transition: width .4s ease;
  }

  /* 汇总卡片 */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat {
    border: 1px solid var(--border); border-radius: 11px;
    padding: 12px 14px; background: #fffdfa;
  }
  .stat .k { font-size: 11.5px; color: var(--muted); }
  .stat .v { font-size: 22px; font-weight: 650; margin-top: 2px; }
  .stat .v small { font-size: 12px; color: var(--muted); font-weight: 400; }

  /* 表格 */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  th { font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .strategy-name { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; }
  .strategy-name.prod { color: var(--brand); font-weight: 650; }
  .best { color: var(--ok); font-weight: 650; }
  .muted { color: var(--muted); }
  .tag-prod {
    font-size: 10.5px; color: var(--brand);
    border: 1px solid #ffd2bf; background: #fff2ec;
    border-radius: 5px; padding: 0 5px; margin-left: 6px;
  }

  /* 筛选 */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .filters select, .filters input {
    font: inherit; font-size: 12.5px; padding: 6px 9px;
    border: 1px solid var(--border); border-radius: 8px;
    background: #fff; color: var(--ink);
  }
  .filters input { min-width: 210px; }
  .filters .count { font-size: 12px; color: var(--muted); margin-left: auto; }

  /* 题目卡片 */
  .qcard {
    border: 1px solid var(--border); border-radius: 11px;
    padding: 12px 14px; margin-bottom: 9px; background: #fff;
  }
  .qhead { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .qid {
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 11.5px; color: var(--muted); min-width: 30px;
  }
  .qtext { font-size: 14px; font-weight: 600; }
  .tag {
    font-size: 10.5px; color: #7b6a5e; background: #fbf3ec;
    border: 1px solid var(--border); border-radius: 5px; padding: 0 6px;
  }
  .tag.flag { color: var(--warn); background: var(--warn-bg); border-color: #f2dfb8; }
  .tag.good { color: var(--ok); background: var(--ok-bg); border-color: #cde9db; }
  .tag.bad { color: var(--bad); background: var(--bad-bg); border-color: #f3cccc; }
  .qhead .open {
    margin-left: auto; border: none; background: none; color: var(--brand);
    font-size: 12px; padding: 0;
  }

  .mini {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 7px; margin-top: 9px;
  }
  .mini > div {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 8px; font-size: 11.5px; background: #fffdfa;
  }
  .mini b {
    display: block; font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 11px; color: #7b6a5e; font-weight: 600; margin-bottom: 3px;
  }
  .mini b.prod { color: var(--brand); }
  .mini span { display: inline-block; margin-right: 7px; color: var(--muted); }
  .mini span strong { color: var(--ink); font-weight: 650; }
  .rank1 { color: var(--ok); font-weight: 650; }
  .rank-miss { color: var(--bad); font-weight: 650; }

  .rankings {
    display: grid; grid-template-columns: repeat(4, minmax(230px, 1fr));
    gap: 10px; margin-top: 10px; padding-top: 10px;
    border-top: 1px dashed var(--border);
    overflow-x: auto;
  }
  .rankings.hidden { display: none; }
  .rank-col h5 {
    font-size: 11.5px; color: #7b6a5e; margin-bottom: 6px;
    display: flex; justify-content: space-between; gap: 6px;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .rank-col h5.prod { color: var(--brand); }
  .rank-col ol { list-style: none; }
  .hit {
    display: flex; gap: 6px; font-size: 11.5px;
    padding: 4px 5px; border-radius: 6px; margin-bottom: 3px;
    color: #6b6b6b; background: #fffdfa; border: 1px solid transparent;
  }
  .hit .pos { color: var(--muted); min-width: 15px; text-align: right; }
  .hit .body { min-width: 0; }
  .hit .path { color: var(--ink); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit .snippet { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit.relevant { background: var(--ok-bg); border-color: #cde9db; }
  .hit.relevant .path { color: #22754a; font-weight: 600; }

  /* 答案卡片 */
  .acard {
    border: 1px solid var(--border); border-left: 3px solid var(--ok);
    border-radius: 11px; padding: 12px 14px; margin-bottom: 9px;
  }
  .acard.bad { border-left-color: var(--bad); }
  .acard .answer {
    font-size: 13px; margin-top: 8px; padding: 8px 10px;
    background: #fffdfa; border: 1px solid var(--border); border-radius: 8px;
    white-space: pre-wrap;
  }
  .facts { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .fact { font-size: 11.5px; border-radius: 5px; padding: 1px 7px; border: 1px solid; }
  .fact.ok { color: var(--ok); background: var(--ok-bg); border-color: #cde9db; }
  .fact.miss { color: var(--bad); background: var(--bad-bg); border-color: #f3cccc; }
  .note { font-size: 12px; color: var(--muted); margin-top: 7px; }
  .note.warn { color: var(--warn); }
  .note.bad { color: var(--bad); }
  details.detail-fold {
    margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 12px;
  }
  details.detail-fold summary {
    cursor: pointer; font-size: 12.5px; color: var(--brand);
  }

  .empty {
    text-align: center; padding: 54px 20px; color: var(--muted); font-size: 13.5px;
  }
  .empty .big { font-size: 38px; margin-bottom: 8px; }
  .hidden { display: none; }

  /* 概况：信息卡 + 结论卡两排 */
  .stats.secondary { margin-top: 10px; }
  .stat.compact .v { font-size: 15px; font-weight: 600; }

  /* 检索质量（确定性） */
  .quality-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .quality-head h2 { margin-bottom: 0; }
  .tabs { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .metric-tab {
    font: inherit; font-size: 12px; cursor: pointer;
    padding: 5px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: #fff; color: var(--muted);
  }
  .metric-tab.active {
    background: var(--brand); border-color: var(--brand); color: #fff;
  }
  .chart { position: relative; padding: 16px 0 0 42px; margin-top: 18px; }
  .chart-grid { position: absolute; left: 42px; right: 0; top: 16px; height: 190px; }
  .chart-grid .line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
  .chart-grid .line span {
    position: absolute; left: -38px; top: -8px; width: 32px;
    text-align: right; font-size: 10.5px; color: var(--muted);
  }
  .chart-groups { display: flex; gap: 14px; align-items: flex-start; }
  .chart-group { flex: 1; min-width: 0; }
  .chart-group.overall {
    border-left: 1px dashed var(--border); margin-left: 2px; padding-left: 14px;
  }
  .chart-group .bars {
    height: 190px; display: flex; align-items: flex-end; justify-content: center; gap: 3px;
  }
  .bar-wrap {
    position: relative; flex: 1; max-width: 34px; height: 100%;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .bar-val {
    position: absolute; left: -9px; right: -9px; text-align: center;
    font-size: 10px; color: var(--muted); white-space: nowrap;
  }
  .bar { width: 100%; border-radius: 4px 4px 0 0; }
  .bar-vector, .swatch.bar-vector { background: #c9b3a3; }
  .bar-bm25, .swatch.bar-bm25 { background: #7cc6a1; }
  .bar-hybrid, .swatch.bar-hybrid { background: var(--brand-2); }
  .bar-hybrid_rerank, .swatch.bar-hybrid_rerank { background: var(--brand); }
  .chart-label {
    margin-top: 7px; text-align: center; font-size: 12px; font-weight: 600;
  }
  .chart-label small {
    display: block; font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 10px; color: var(--muted); font-weight: 400;
  }
  .legend {
    display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px;
    padding-top: 10px; border-top: 1px dashed var(--border);
    font-size: 12px; color: #6b6b6b;
  }
  .legend .swatch {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 3px; margin-right: 6px; vertical-align: -1px;
  }
  .insight {
    margin-top: 12px; padding: 9px 12px; border: 1px dashed var(--border);
    border-radius: 9px; background: #fffdfa; font-size: 12.5px; color: #6b6b6b;
  }
  .insight b { color: var(--brand); }

  /* 完整数据 */
  tr.best-row td { background: #fff2ec; }
  .dnote {
    margin-top: 12px; padding: 9px 12px; border: 1px dashed var(--border);
    border-radius: 9px; background: #fffdfa; font-size: 12.5px; color: #6b6b6b;
  }
  .dnote b { color: var(--brand); }

  /* 忠实度 */
  .faith-grid {
    display: grid; grid-template-columns: minmax(0, 1fr) 230px;
    gap: 22px; align-items: center; margin-top: 4px;
  }
  .faith-bars { display: flex; flex-direction: column; gap: 13px; }
  .faith-top {
    display: flex; justify-content: space-between; gap: 10px;
    font-size: 12.5px; margin-bottom: 5px;
  }
  .faith-top strong { font-variant-numeric: tabular-nums; }
  .progress-track {
    height: 12px; border-radius: 99px; background: #f6ece4;
    border: 1px solid var(--border); overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: var(--ok); border-radius: 99px;
    transition: width .3s ease;
  }
  .faith-refusal {
    text-align: center; border-left: 1px dashed var(--border); padding-left: 22px;
  }
  .donut {
    width: 150px; height: 150px; border-radius: 50%;
    margin: 0 auto; display: flex; align-items: center; justify-content: center;
  }
  .donut-hole {
    width: 112px; height: 112px; border-radius: 50%; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .donut-hole strong { font-size: 26px; }
  .donut-hole small { font-size: 11.5px; color: var(--muted); }
  .faith-refusal-note {
    margin-top: 10px; font-size: 12px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .faith-refusal-note b { color: #6b6b6b; }
  .faith-refusal-note span { color: var(--muted); }
  .faith-foot { margin-top: 14px; padding: 9px 12px; border-radius: 9px; font-size: 12.5px; }
  .faith-foot.ok { color: var(--ok); background: var(--ok-bg); border: 1px solid #cde9db; }
  .faith-foot.bad { color: var(--bad); background: var(--bad-bg); border: 1px solid #f3cccc; }

  /* 编造个案 */
  .fab-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .fab-head h2 { margin-bottom: 0; }
  .count-badge {
    font-size: 11.5px; color: var(--brand); background: #fff2ec;
    border: 1px solid #ffd2bf; border-radius: 6px; padding: 1px 7px;
  }
  .fab-toggle {
    margin-left: auto; background: #fff; color: var(--brand);
    border: 1px solid #ffd2bf; padding: 5px 12px; font-size: 12px; border-radius: 8px;
  }
  .fab-card {
    border: 1px solid var(--border); border-left: 3px solid var(--bad);
    border-radius: 11px; padding: 12px 14px; margin-top: 10px;
  }
  .fab-label { font-size: 11px; color: var(--muted); margin: 10px 0 3px; }
  .fab-reason {
    font-size: 12.5px; color: #6b6b6b; background: #fffdfa;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  }
  .fab-card .answer {
    font-size: 13px; margin-top: 0; padding: 8px 10px;
    background: #fffdfa; border: 1px solid var(--border); border-radius: 8px;
    white-space: pre-wrap;
  }

  /* 编造个案台账 */
  .ledger-metrics {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px; margin: 14px 0;
  }
  .ledger-card {
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; background: #fffdfa;
  }
  .ledger-card .k { font-size: 11.5px; color: var(--muted); }
  .ledger-card .v {
    font-size: 22px; font-weight: 650; margin: 2px 0;
    font-variant-numeric: tabular-nums;
  }
  .ledger-card .h { font-size: 11px; color: var(--muted); }
  .ledger-card.hot .v { color: var(--bad); }
  .ledger-card.ok .v { color: var(--ok); }
  .status-badge {
    display: inline-block; font-size: 11px; padding: 1px 7px;
    border-radius: 6px; border: 1px solid; white-space: nowrap;
  }
  .status-open { color: #9a6b00; background: #fff8e6; border-color: #f0d9a8; }
  .status-resolved { color: var(--bad); background: var(--bad-bg); border-color: #f3cccc; }
  .status-not-needed { color: var(--ok); background: var(--ok-bg); border-color: #cde9db; }
  .ledger-case {
    border: 1px solid var(--border); border-left: 3px solid var(--warn);
    border-radius: 11px; padding: 12px 14px; margin-top: 10px;
  }
  .ledger-case.resolved { border-left-color: var(--bad); }
  .ledger-case.not-needed { border-left-color: var(--ok); }
  .ledger-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ledger-meta { font-size: 11.5px; color: var(--muted); margin-left: auto; }
  .ledger-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .ledger-actions button { font-size: 12px; padding: 5px 10px; }
  /* 同权重下 .ledger-note 后写在 .hidden 之后会盖掉 display:none，必须显式提高权重 */
  .ledger-note.hidden { display: none; }
  .ledger-note { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .ledger-actions button.active {
    outline: 2px solid var(--brand); outline-offset: 2px;
    font-weight: 650;
  }
  .ledger-actions button.active::after { content: " ✓"; }
  .ledger-note textarea {
    flex: 1; min-width: 220px; min-height: 58px; resize: vertical;
    font: inherit; font-size: 12.5px; padding: 7px 9px;
    border: 1px solid var(--border); border-radius: 8px; background: #fff;
  }
  .ledger-note button { font-size: 12px; padding: 5px 10px; align-self: flex-start; }
  .ledger-evidence { margin-top: 8px; }
  .ledger-evidence summary { cursor: pointer; font-size: 12px; color: var(--brand); }
  .evidence-item {
    font-size: 12px; color: #555; border-top: 1px dashed var(--border);
    padding: 8px 0; white-space: pre-wrap;
  }
  .evidence-item b { color: var(--brand); }

  /* 飞轮趋势 */
  .badge {
    font-size: 10.5px; font-weight: 600; color: var(--brand);
    background: #fff1e8; border: 1px solid #ffd9c4; border-radius: 5px;
    padding: 1px 7px;
  }
  .alert {
    font-size: 12.5px; color: var(--bad); background: var(--bad-bg);
    border: 1px solid #f3cccc; border-radius: 9px; padding: 9px 12px; margin: 10px 0;
  }
  .trend-wrap { overflow-x: auto; margin-top: 10px; }
  .trend-table { border-collapse: separate; border-spacing: 8px 0; min-width: 100%; }
  .trend-table th, .trend-table td { border-bottom: none; padding: 8px 0; vertical-align: top; }
  .trend-table th { font-size: 11px; padding-left: 10px; }
  .trend-set { min-width: 150px; padding-left: 0 !important; padding-top: 10px !important; }
  .trend-set b { display: block; font-size: 13px; }
  .trend-set span { font-size: 11px; color: var(--muted); }
  .round-cell {
    border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px;
    background: #fffdfa; min-width: 162px;
  }
  .round-cell.latest { border-color: #ffd0b8; box-shadow: inset 0 0 0 1px #ffe8dc; }
  .round-cell.flag { border-color: #f3cccc; background: #fffafa; }
  .round-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .round-trigger {
    font-size: 10px; border-radius: 4px; padding: 0 5px;
    background: #fbf3ec; color: #7b6a5e; border: 1px solid var(--border);
  }
  .round-trigger.auto { color: #6d4fc4; background: #f3eefd; border-color: #ded2f7; }
  .round-time { font-size: 10.5px; color: var(--muted); margin-left: auto; }
  .round-metric { display: flex; gap: 6px; font-size: 11.5px; line-height: 1.7; }
  .round-metric span { color: var(--muted); min-width: 68px; }
  .round-metric b { font-variant-numeric: tabular-nums; }
  .round-metric em { font-style: normal; font-size: 10.5px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .delta.up { color: var(--ok); }
  .delta.down { color: var(--bad); }
  .round-status { font-size: 10.5px; color: var(--muted); border-top: 1px dashed var(--border); margin-top: 5px; padding-top: 4px; }
  .round-status.warn { color: var(--warn); }

  /* 置信度阈值校准 */
  .cal-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
  .cal-card { border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px; background: #fffdfa; }
  .cal-card .k { font-size: 11.5px; color: var(--muted); }
  .cal-card .v { font-size: 26px; font-weight: 650; margin: 2px 0 3px; }
  .cal-card .hint { font-size: 11px; color: var(--muted); line-height: 1.5; }
  .cal-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: #6b6b6b; margin-top: 18px; }
  .cal-legend i {
    display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 5px; vertical-align: -1px;
  }
  .cal-legend i.dash { width: 14px; height: 0; border-top: 2px dashed #333; border-radius: 0; }
  .scan-chart { width: 100%; margin-top: 6px; }
  .scan-chart text { font-size: 11px; fill: var(--muted); font-family: inherit; }
  .scan-chart .axis { stroke: #eadfd5; stroke-width: 1; }
  .scan-chart .grid { stroke: #f4ece5; stroke-dasharray: 3 4; }
  .scan-note {
    border: 1.5px dashed #d9c9bb; border-radius: 10px; padding: 10px 13px;
    font-size: 12px; color: #6b5d52; line-height: 1.8; margin-top: 12px;
  }
  .scan-note b { color: var(--ink); }
  .explain-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .explain {
    border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px;
    font-size: 12px; color: #6b6b6b; line-height: 1.75;
  }
  .explain b { display: block; color: var(--ink); font-size: 12.5px; margin-bottom: 3px; }
  .cal-run-title { font-size: 11.5px; color: var(--muted); margin-top: 18px; }
  .cal-run { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  .cal-run .cap { font-size: 11.5px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .cal-run-state { font-size: 12px; color: var(--muted); }
  .cal-run-state.error { color: var(--bad); }

  @media (max-width: 760px) {
    .cal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .explain-grid { grid-template-columns: 1fr; }
    .mini { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .rankings { grid-template-columns: repeat(4, 230px); }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .faith-grid { grid-template-columns: 1fr; }
    .faith-refusal { border-left: none; border-top: 1px dashed var(--border); padding: 18px 0 0; }
    .chart-groups { gap: 7px; }
    .chart-label { font-size: 10.5px; }
    .bar-val { display: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="brand">
      <div class="logo">🧪</div>
      <div>
        <h1>RAG 评估</h1>
        <p>四策略检索对照 · 证据覆盖 · 端到端答案覆盖</p>
      </div>
    </div>
    <a class="ghost" href="/">← 回到对话</a>
  </header>

  <section class="card">
    <div class="controls">
      <button id="run-retrieval">重跑检索评估</button>
      <button id="run-full" class="secondary">重跑端到端评估</button>
      <span id="run-state" class="run-state">加载中…</span>
    </div>
    <div id="progress" class="progress"><div id="bar" class="bar"></div></div>
  </section>

  <div id="banner"></div>
  <main id="content">
    <div class="empty"><div class="big">🧪</div>还没有评估结果，点上面的按钮跑一轮。</div>
  </main>
</div>

<script>
"use strict";

const BUCKET_LABEL = {
  A_policy: "政策事实",
  B_model: "型号参数",
  C_colloquial: "口语提问",
  E_multi: "多跳组合",
  D_absent: "知识库未覆盖",
};
const DIFF_LABEL = { easy: "简单", medium: "中等", hard: "困难" };
const BEHAVIOR_LABEL = { answer: "回答", refuse: "拒答", no_commitment: "不承诺" };
const STRATEGY_ORDER = ["vector", "bm25", "hybrid", "hybrid_rerank"];
const PROD = "hybrid_rerank";
const BUCKET_ORDER = ["A_policy", "B_model", "C_colloquial", "E_multi"];
const BUCKET_SHORT = {
  A_policy: "政策类", B_model: "型号类", C_colloquial: "口语类", E_multi: "跨文档类",
};
const STRATEGY_CN = {
  vector: "纯向量", bm25: "纯 BM25", hybrid: "混合", hybrid_rerank: "混合 + 重排",
};
const METRIC_META = {
  "mrr@10": {
    label: "MRR",
    hint: "MRR 看排得够不够靠前：第一条相关证据的平均名次倒数，越高越好。",
  },
  "recall@5": {
    label: "Recall@5",
    hint: "Recall@5 看该题的证据有没有进前五条，越高越好。",
  },
  evidence: {
    label: "证据覆盖度",
    hint: "证据覆盖度是另一件事：前 10 条证据里，标准要点的命中比例，越高越好。",
  },
};

let latest = null;
let trends = null;
let calibration = null;
let calRunning = false;
let trendWidth = 1;
let filter = { bucket: "", difficulty: "", behavior: "", text: "" };
let qualityMetric = "mrr@10";
let wasRunning = false;

const $ = (id) => document.getElementById(id);

function esc(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function plainText(value) {
  // 去掉 Markdown 的 **加粗** 标记，用于 title 这类不能渲染 HTML 的地方。
  return String(value ?? "").replace(/\*\*([^*\n]+)\*\*/g, "$1");
}
function formatAnswer(value) {
  // 先转义再还原 **...** 为 <strong>：模型生成的内容不能直接当 HTML 执行。
  return esc(value).replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
}
function pct(value, digits = 1) {
  if (value === null || value === undefined) return "—";
  return (value * 100).toFixed(digits) + "%";
}
function num(value, digits = 3) {
  if (value === null || value === undefined) return "—";
  return Number(value).toFixed(digits);
}
function tag(text, cls = "") {
  return `<span class="tag ${cls}">${esc(text)}</span>`;
}
function strategyLabel(name) {
  return `<span class="strategy-name ${name === PROD ? "prod" : ""}">${esc(name)}${
    name === PROD ? '<span class="tag-prod">线上</span>' : ""
  }</span>`;
}

/* ---------- 指标计算 ---------- */

function meanOf(values) {
  const nums = (values || []).filter((v) => typeof v === "number" && !Number.isNaN(v));
  return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;
}

function metricOf(question, strategy, metric) {
  const row = (question.strategies || {})[strategy] || {};
  if (metric === "evidence") {
    const rate = (row.evidence_coverage || {}).rate;
    return typeof rate === "number" ? rate : null;
  }
  const value = (row.metrics || {})[metric];
  return typeof value === "number" ? value : null;
}

function bucketMetric(data, bucket, metric, strategy) {
  const rows = (data.questions || []).filter((q) => q.bucket === bucket);
  return meanOf(rows.map((q) => metricOf(q, strategy, metric)));
}

function overallMetric(data, metric, strategy) {
  // D_absent 没有标准答案，所有汇总都排除它。
  const rows = (data.questions || []).filter((q) => q.bucket !== "D_absent");
  return meanOf(rows.map((q) => metricOf(q, strategy, metric)));
}

function bestOverall(data, metric = "mrr@10") {
  return STRATEGY_ORDER
    .filter((s) => (data.strategies || {})[s])
    .map((s) => ({ strategy: s, value: overallMetric(data, metric, s) }))
    .filter((row) => row.value !== null)
    .sort((a, b) => b.value - a.value)[0] || null;
}

function shortModel(value) {
  if (!value) return "—";
  const parts = String(value).split("/");
  return parts[parts.length - 1];
}

function formatTime(value) {
  if (!value) return "—";
  return String(value).replace("T", " ").slice(0, 16);
}

/* ---------- 汇总 ---------- */

function renderSummary(data) {
  const a = data.answers;
  const models = data.models || {};
  const best = bestOverall(data);
  const bm25Mrr = bucketMetric(data, "C_colloquial", "mrr@10", "bm25");
  const prodMrr = bucketMetric(data, "C_colloquial", "mrr@10", PROD);
  const rise = bm25Mrr !== null && prodMrr !== null ? prodMrr - bm25Mrr : null;
  const refusalRate = a && a.refusal_total ? a.refusal_correct / a.refusal_total : null;

  const info = [
    ["评估集", `${data.samples ?? "—"}`, "题", false],
    ["知识库", `${data.collection_count ?? "—"}`, "块", false],
    ["嵌入 / 重排", `${shortModel(models.embed)} · ${shortModel(models.rerank)}`, "", true],
    ["裁判模型", models.judge || "—", "", true],
    ["上次跑于", formatTime(data.finished_at), "", true],
  ];
  const highlights = [
    ["最佳整体 MRR", best ? num(best.value, 3) : "—",
      best ? `${STRATEGY_CN[best.strategy] || best.strategy} · 四策略最高` : "—", false],
    ["口语桶 MRR 提升", rise === null ? "—" : `${rise >= 0 ? "+" : ""}${rise.toFixed(3)}`,
      rise === null ? "—" : `纯 BM25 ${num(bm25Mrr, 3)} → 混合 + 重排 ${num(prodMrr, 3)}`, false],
    ["答案覆盖度（重排）", a ? pct(a.coverage) : "—",
      a ? `${a.covered}/${a.answered}` : "—", false],
    ["库外问题拒答", refusalRate === null ? "—" : pct(refusalRate, 0),
      a ? `${a.refusal_correct}/${a.refusal_total} 正确拒答` : "—", false],
  ];
  const renderCards = (rows) => rows.map(([k, v, note, compact]) => `
    <div class="stat ${compact ? "compact" : ""}">
      <div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>
      <div class="k">${esc(note)}</div>
    </div>`).join("");

  return `<section class="card">
    <h2>📊 本轮概况</h2>
    <p class="sub">run ${esc(data.run_id)} · ${esc(data.started_at || "")} → ${esc(data.finished_at || "")} · ${
      data.mode === "full" ? "端到端" : "检索"}</p>
    <div class="stats">${renderCards(info)}</div>
    <div class="stats secondary">${renderCards(highlights)}</div>
    ${data.degraded > 0 ? `<p class="note warn">⚠️ 有 ${data.degraded} 次重排或改写降级，对应排序可能退化为未精排结果。</p>` : ""}
  </section>`;
}

function renderStrategyTable(data) {
  const strategies = data.strategies || {};
  const answerable = (data.questions || []).filter((q) => q.bucket !== "D_absent").length;
  const absent = (data.samples || answerable) - answerable;
  const rows = STRATEGY_ORDER.filter((s) => strategies[s]).map((name) => {
    const m = strategies[name];
    return `<tr>
      <td>${strategyLabel(name)}</td>
      <td class="num">${pct(m["recall@5"])}</td>
      <td class="num">${pct(m["recall@10"])}</td>
      <td class="num">${num(m["mrr@10"])}</td>
      <td class="num">${pct(m.evidence_coverage)}</td>
      <td class="num muted">${m.questions}</td>
    </tr>`;
  }).join("");

  return `<section class="card">
    <h2>🔍 四策略对照</h2>
    <p class="sub">Recall/MRR 的题集为 ${answerable} 道可回答题（知识库未覆盖的 ${absent} 题不计）；证据覆盖率 = 前 10 条证据覆盖标准要点的比例。</p>
    <table>
      <thead><tr>
        <th>策略</th><th class="num">Recall@5</th><th class="num">Recall@10</th>
        <th class="num">MRR@10</th><th class="num">证据覆盖</th><th class="num">题数</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </section>`;
}

/* ---------- 检索质量（确定性） ---------- */

function renderQualitySection(data) {
  return `<section class="card">
    <div class="quality-head">
      <h2>🔍 检索质量（确定性）</h2>
      <span class="tag good">不依赖大模型 · 可复现</span>
      <div class="tabs">
        ${Object.entries(METRIC_META).map(([key, meta]) => `
          <button type="button" class="metric-tab ${key === qualityMetric ? "active" : ""}" data-metric="${key}">${meta.label}</button>
        `).join("")}
      </div>
    </div>
    <p class="sub" id="quality-hint">${METRIC_META[qualityMetric].hint} 分桶按 A/B/C/E 四类可回答题统计，D_absent 没有标准答案，不参与。</p>
    <div id="quality-chart">${renderQualityChart(data, qualityMetric)}</div>
    <div id="quality-note">${renderQualityNote(data, qualityMetric)}</div>
  </section>`;
}

function renderQualityChart(data, metric) {
  const groups = BUCKET_ORDER.map((bucket) => ({
    key: bucket,
    label: BUCKET_SHORT[bucket] || bucket,
    values: Object.fromEntries(
      STRATEGY_ORDER.map((s) => [s, bucketMetric(data, bucket, metric, s)])
    ),
  }));
  groups.push({
    key: "overall",
    label: "总体",
    values: Object.fromEntries(
      STRATEGY_ORDER.map((s) => [s, overallMetric(data, metric, s)])
    ),
  });

  const lines = [0, 0.25, 0.5, 0.75, 1].map((value) => `
    <div class="line" style="bottom:${value * 100}%"><span>${value.toFixed(2)}</span></div>
  `).join("");

  const bars = groups.map((group, index) => `
    <div class="chart-group ${index === groups.length - 1 ? "overall" : ""}">
      <div class="bars">
        ${STRATEGY_ORDER.map((s) => {
          const value = group.values[s];
          const height = value === null ? 0 : Math.max(0, Math.min(1, value)) * 190;
          return `<div class="bar-wrap" title="${esc(STRATEGY_CN[s] || s)} · ${esc(METRIC_META[metric].label)} ${
            value === null ? "—" : num(value, 3)}">
            <span class="bar-val" style="bottom:${height + 3}px">${value === null ? "—" : num(value, 3)}</span>
            <div class="bar bar-${s}" style="height:${height}px"></div>
          </div>`;
        }).join("")}
      </div>
      <div class="chart-label">${esc(group.label)}<small>${esc(group.key)}</small></div>
    </div>`).join("");

  return `<div class="chart">
      <div class="chart-grid">${lines}</div>
      <div class="chart-groups">${bars}</div>
    </div>
    <div class="legend">
      ${STRATEGY_ORDER.map((s) => `<span><i class="swatch bar-${s}"></i>${esc(STRATEGY_CN[s] || s)}</span>`).join("")}
    </div>`;
}

function renderQualityNote(data, metric) {
  const ranked = STRATEGY_ORDER
    .map((s) => ({ strategy: s, value: overallMetric(data, metric, s) }))
    .filter((row) => row.value !== null)
    .sort((a, b) => b.value - a.value);
  if (!ranked.length) return "";
  const best = ranked[0];
  const weakest = BUCKET_ORDER
    .map((bucket) => ({ bucket, value: bucketMetric(data, bucket, metric, PROD) }))
    .filter((row) => row.value !== null)
    .sort((a, b) => a.value - b.value)[0];
  return `<p class="insight"><b>读图</b> 看 ${esc(METRIC_META[metric].label)}，${
    esc(STRATEGY_CN[best.strategy] || best.strategy)} 总体 ${num(best.value, 3)} 最高${
    weakest ? `；但 ${esc(BUCKET_SHORT[weakest.bucket])} 只有 ${num(weakest.value, 3)}，这是线上策略要重点补的短板` : ""
  }。</p>`;
}

function bindQualityTabs() {
  document.querySelectorAll(".metric-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      qualityMetric = btn.dataset.metric;
      document.querySelectorAll(".metric-tab").forEach((b) => b.classList.toggle("active", b === btn));
      const chart = $("quality-chart");
      const note = $("quality-note");
      const hint = $("quality-hint");
      if (chart) chart.innerHTML = renderQualityChart(latest, qualityMetric);
      if (note) note.innerHTML = renderQualityNote(latest, qualityMetric);
      if (hint) hint.textContent = `${METRIC_META[qualityMetric].hint} 分桶按 A/B/C/E 四类可回答题统计，D_absent 没有标准答案，不参与。`;
    });
  });
}

/* ---------- 完整数据 ---------- */

function renderFullData(data) {
  const rows = STRATEGY_ORDER
    .filter((s) => (data.strategies || {})[s])
    .map((s) => ({
      strategy: s,
      mrr: Object.fromEntries(BUCKET_ORDER.map((b) => [b, bucketMetric(data, b, "mrr@10", s)])),
      overall: overallMetric(data, "mrr@10", s),
      evidence: overallMetric(data, "evidence", s),
      answer: s === PROD && data.answers ? data.answers.coverage : null,
    }));
  const bestValue = Math.max(...rows.map((row) => row.overall ?? -1));
  const a = data.answers;
  const refusal = a && a.refusal_total
    ? `${a.refusal_correct}/${a.refusal_total} = ${pct(a.refusal_correct / a.refusal_total, 0)} 正确拒答`
    : "—";

  return `<section class="card">
    <h2>📋 完整数据</h2>
    <p class="sub">左半是分桶 MRR，右边是总体证据覆盖与答案覆盖；带底色那行是总体 MRR 最好的策略。答案只有线上「混合 + 重排」跑过端到端，其余策略记 —。</p>
    <table>
      <thead><tr>
        <th>策略</th>
        ${BUCKET_ORDER.map((b) => `<th class="num">${esc(BUCKET_SHORT[b])} MRR</th>`).join("")}
        <th class="num">总体 MRR</th><th class="num">证据覆盖</th><th class="num">答案覆盖</th>
      </tr></thead>
      <tbody>
        ${rows.map((row) => `<tr class="${row.overall !== null && row.overall === bestValue ? "best-row" : ""}">
          <td>${esc(STRATEGY_CN[row.strategy] || row.strategy)} <span class="strategy-name muted">${esc(row.strategy)}</span>${
            row.strategy === PROD ? '<span class="tag-prod">线上</span>' : ""}</td>
          ${BUCKET_ORDER.map((b) => `<td class="num">${num(row.mrr[b], 3)}</td>`).join("")}
          <td class="num">${num(row.overall, 3)}</td>
          <td class="num">${pct(row.evidence)}</td>
          <td class="num ${row.answer === null ? "muted" : ""}">${pct(row.answer)}</td>
        </tr>`).join("")}
      </tbody>
    </table>
    <p class="dnote"><b>D_absent</b> 库外问题没有标准答案，不参与上表。它只评「该拒有没有拒」：${esc(refusal)}。</p>
  </section>`;
}

/* ---------- 忠实度 ---------- */

function renderFaithfulness(data) {
  if (!data.answers) {
    return `<section class="card">
      <h2>🎯 忠实度</h2>
      <p class="sub">这次只跑了检索评估，没有判忠实度。点「重跑端到端评估」补齐。</p>
    </section>`;
  }
  const a = data.answers;
  const buckets = BUCKET_ORDER.map((bucket) => {
    const rows = (data.questions || []).filter(
      (q) => q.bucket === bucket && q.faithful !== null && q.faithful !== undefined
    );
    const ok = rows.filter((q) => q.faithful).length;
    return { bucket, ok, total: rows.length, rate: rows.length ? ok / rows.length : null };
  });
  const refusalRate = a.refusal_total ? a.refusal_correct / a.refusal_total : null;
  const donutColor = refusalRate === null
    ? "var(--border)" : refusalRate === 1 ? "var(--ok)" : "var(--warn)";
  const degree = refusalRate === null ? 0 : Math.round(refusalRate * 360);

  return `<section class="card">
    <h2>🎯 忠实度 <span class="muted" style="font-weight:400">Faithfulness</span></h2>
    <p class="sub">混合 + 重排 · 答案有没有编造；判为不通过的逐条列在下面的「编造个案」里。</p>
    <div class="faith-grid">
      <div class="faith-bars">
        ${buckets.map((row) => `
          <div class="faith-row">
            <div class="faith-top">
              <span>${esc(BUCKET_SHORT[row.bucket])} <span class="muted">${esc(row.bucket)}</span> · 评 ${row.total} 题</span>
              <strong>${row.rate === null ? "—" : pct(row.rate, 1)}</strong>
            </div>
            <div class="progress-track">
              <div class="progress-fill" style="width:${row.rate === null ? 0 : row.rate * 100}%"></div>
            </div>
          </div>`).join("")}
      </div>
      <div class="faith-refusal">
        <div class="donut" style="background: conic-gradient(${donutColor} ${degree}deg, #f2e9e1 0deg)">
          <div class="donut-hole"><strong>${pct(refusalRate, 0)}</strong><small>拒答率</small></div>
        </div>
        <div class="faith-refusal-note">
          <b>D_absent 桶 · 库外问题</b>
          <span>${a.refusal_correct}/${a.refusal_total} 正确拒答</span>
        </div>
      </div>
    </div>
    <p class="faith-foot ${refusalRate === 1 ? "ok" : "bad"}">${refusalRate === 1
      ? `✓ 库外问题评上的 ${a.refusal_total} 道题全部正确拒答，没有「该拒没拒」的个案。`
      : `✗ 库外问题 ${a.refusal_total} 道中有 ${a.refusal_total - a.refusal_correct} 道没有正确拒答。`}</p>
  </section>`;
}

/* ---------- 编造个案 ---------- */

function renderFabrication(data) {
  if (!data.answers) return "";
  const cases = (data.questions || []).filter((q) => q.faithful === false);
  return `<section class="card">
    <div class="fab-head">
      <h2>🧨 编造个案 <span class="count-badge">${cases.length} 例</span></h2>
      ${cases.length ? '<button class="fab-toggle" id="fab-toggle" type="button">展开 ▾</button>' : ""}
    </div>
    <p class="sub">这些是本轮生成答案里，被忠实度裁判判为「有检索证据没支撑的内容」的个案。点开看问题 / 生成答案 / 裁判理由。</p>
    ${cases.length
      ? `<div id="fab-list" class="hidden">
          ${cases.map((q) => `
            <div class="fab-card">
              <div class="qhead">
                <span class="qid">${esc(q.id)}</span>
                <span class="qtext">${esc(q.query)}</span>
                ${tag(BUCKET_LABEL[q.bucket] || q.bucket || "—")}
              </div>
              <div class="fab-label">裁判理由</div>
              <p class="fab-reason">${formatAnswer(q.judge_reason || "（无）")}</p>
              <div class="fab-label">生成答案（原文）</div>
              <div class="answer">${formatAnswer(q.answer || "(空)")}</div>
            </div>`).join("")}
        </div>`
      : '<div class="empty" style="padding:20px">本轮没有编造个案。</div>'}
  </section>`;
}

function bindFabrication() {
  const btn = $("fab-toggle");
  if (!btn) return;
  btn.addEventListener("click", () => {
    const list = $("fab-list");
    const hidden = list.classList.toggle("hidden");
    btn.textContent = hidden ? "展开 ▾" : "收起 ▴";
  });
}

/* ---------- 编造个案台账 ---------- */

const faithPending = {};

function statusClass(status) {
  if (status === "已解决") return "status-resolved";
  if (status === "无需解决") return "status-not-needed";
  return "status-open";
}

function renderFaithLedger() {
  return `<section class="card" id="faith-ledger">
    <div class="fab-head">
      <h2>📒 编造个案台账 <span class="count-badge" id="ledger-badge">加载中…</span></h2>
      <button class="fab-toggle" id="ledger-refresh" type="button">刷新台账</button>
    </div>
    <p class="sub">判出率 =（本轮裁判判出 + 库外该拒没拒）÷ 本轮评估题数；确认幻觉率 = 人工标为「已解决」的条数 ÷ 本轮评估题数，是下界。「无需解决」是裁判误报，不计入确认幻觉。</p>
    <div id="faith-ledger-body"><div class="empty" style="padding:20px">加载台账…</div></div>
  </section>`;
}

function renderFaithLedgerBody(data) {
  const round = data.round || {};
  const ledger = data.ledger || {};
  const cards = [
    ["判出率", pct(round.judged_rate, 2),
      `${(round.judged || 0) + (round.missed_refusals || 0)} / ${data.samples || 0} 题`,
      round.judged_rate > 0 ? "hot" : "ok"],
    ["确认幻觉率", pct(round.confirmed_rate, 2),
      `${round.resolved || 0} / ${data.samples || 0} 题（下界）`,
      round.confirmed_rate > 0 ? "hot" : "ok"],
    ["待处置", String(round.open || 0), "未解决，等人过目",
      round.open ? "" : "ok"],
    ["裁判误报", String(round.not_needed || 0), "已标「无需解决」", "ok"],
    ["跨轮台账", String(ledger.total || 0),
      `未解决 ${ledger.open || 0} · 已解决 ${ledger.resolved || 0} · 无需解决 ${ledger.not_needed || 0}`,
      ""],
  ];

  const metrics = `<div class="ledger-metrics">
    ${cards.map(([k, v, h, cls]) => `
      <div class="ledger-card ${cls}">
        <div class="k">${esc(k)}</div>
        <div class="v">${esc(v)}</div>
        <div class="h">${esc(h)}</div>
      </div>`).join("")}
  </div>`;

  if (!(data.cases || []).length) {
    return `${metrics}<div class="empty" style="padding:20px">本轮没有判出编造个案。跨轮台账累计 ${esc(ledger.total || 0)} 条。</div>`;
  }

  return `${metrics}${data.cases.map(renderFaithCase).join("")}`;
}

function renderFaithCase(c) {
  const cls = c.status === "已解决" ? "resolved" : c.status === "无需解决" ? "not-needed" : "";
  const source = c.source === "missed_refusal"
    ? tag("该拒没拒", "bad") : tag("裁判判出");
  const evidence = (c.citations || []).map((item) => `
    <div class="evidence-item">
      <b>[${esc(item.n)}]</b> ${esc(item.section_path || item.doc_root || "")}
      ${item.row_category ? `<span class="muted">（${esc(item.row_category)}）</span>` : ""}
      <div>问：${esc(item.question || "")}</div>
      <div>答：${esc(item.answer || "")}</div>
    </div>`).join("");
  const noteId = `faith-note-${c.eval_id}`;
  return `<div class="ledger-case ${cls}">
    <div class="ledger-head">
      <span class="qid">${esc(c.eval_id)}</span>
      <span class="qtext">${esc(c.query)}</span>
      ${tag(BUCKET_LABEL[c.bucket] || c.bucket || "—")}
      ${source}
      <span class="status-badge ${statusClass(c.status)}">${esc(c.status)}</span>
      <span class="ledger-meta">${c.seen_count > 1 ? `出现 ${c.seen_count} 次` : "首次出现"}</span>
    </div>
    <div class="fab-label">裁判理由</div>
    <p class="fab-reason">${formatAnswer(c.reason || "（无）")}</p>
    <div class="fab-label">生成答案（原文）</div>
    <div class="answer">${formatAnswer(c.answer || "(空)")}</div>
    ${c.resolution ? `<div class="fab-label">处置说明</div>
      <p class="fab-reason">${formatAnswer(c.resolution)}</p>` : ""}
    <details class="ledger-evidence">
      <summary>证据原文（本轮喂进去的 ${(c.citations || []).length} 条）</summary>
      ${evidence || '<div class="empty" style="padding:10px">本轮没有证据快照。</div>'}
    </details>
    <div class="ledger-actions">
      <button type="button" data-faith-action="已解决" data-faith-id="${esc(c.eval_id)}">标为真幻觉（已解决）</button>
      <button type="button" class="secondary" data-faith-action="无需解决" data-faith-id="${esc(c.eval_id)}">裁判误报（无需解决）</button>
      ${c.status !== "未解决"
        ? `<button type="button" class="secondary" data-faith-action="未解决" data-faith-id="${esc(c.eval_id)}">退回未解决</button>`
        : ""}
    </div>
    <div class="ledger-note hidden" id="${noteId}">
      <textarea placeholder="必须留一句交代：怎么解决的，或为什么不用改"></textarea>
      <button type="button" data-faith-submit="1" data-faith-id="${esc(c.eval_id)}">提交处置</button>
      <button type="button" class="secondary" data-faith-cancel="1">取消</button>
    </div>
  </div>`;
}

async function submitFaithCase(evalId, status, resolution) {
  try {
    const resp = await fetch(`/rag-eval/api/faith-cases/${encodeURIComponent(evalId)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status, resolution }),
    });
    const body = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(body.detail || `HTTP ${resp.status}`);
    await loadFaithLedger();
  } catch (err) {
    alert("处置失败：" + err.message);
  }
}

function bindFaithLedger() {
  const body = $("faith-ledger-body");
  if (!body) return;

  body.querySelectorAll("[data-faith-action]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const evalId = btn.dataset.faithId;
      const status = btn.dataset.faithAction;
      if (status === "未解决") {
        submitFaithCase(evalId, status, null);
        return;
      }
      const note = $(`faith-note-${evalId}`);
      if (!note) return;
      faithPending[evalId] = status;
      btn.closest(".ledger-case").querySelectorAll("[data-faith-action]").forEach((b) => {
        b.classList.toggle("active", b === btn);
      });
      note.classList.remove("hidden");
      note.querySelector("textarea").focus();
    });
  });

  body.querySelectorAll("[data-faith-submit]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const evalId = btn.dataset.faithId;
      const status = faithPending[evalId];
      if (!status) {
        alert("请先选择处置方式：标为真幻觉，还是裁判误报。");
        return;
      }
      const note = $(`faith-note-${evalId}`);
      const resolution = note ? note.querySelector("textarea").value.trim() : "";
      if (!resolution) {
        alert("处置必须留一句交代：怎么解决的，或为什么不用改。");
        return;
      }
      submitFaithCase(evalId, status, resolution);
    });
  });

  body.querySelectorAll("[data-faith-cancel]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const note = btn.closest(".ledger-note");
      const evalId = note.id.replace(/^faith-note-/, "");
      delete faithPending[evalId];
      note.parentElement.querySelectorAll("[data-faith-action]").forEach((b) => {
        b.classList.remove("active");
      });
      note.classList.add("hidden");
    });
  });
}

async function loadFaithLedger() {
  const body = $("faith-ledger-body");
  const badge = $("ledger-badge");
  if (!body) return;
  try {
    const resp = await fetch("/rag-eval/api/faith-cases");
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(data.detail || `HTTP ${resp.status}`);
    body.innerHTML = renderFaithLedgerBody(data);
    if (badge) badge.textContent = `${data.round.open} 待处置 / ${data.cases.length} 本轮`;
    bindFaithLedger();
  } catch (err) {
    body.innerHTML = `<div class="empty" style="padding:20px">台账加载失败：${esc(err.message)}</div>`;
    if (badge) badge.textContent = "不可用";
  }
}

/* ---------- 筛选 ---------- */

function renderFilterBar() {
  return `<div class="filters">
    <select id="f-bucket">
      <option value="">全部分桶</option>
      ${Object.entries(BUCKET_LABEL).map(([k, v]) => `<option value="${k}">${v}（${k}）</option>`).join("")}
    </select>
    <select id="f-difficulty">
      <option value="">全部难度</option>
      ${Object.entries(DIFF_LABEL).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}
    </select>
    <select id="f-behavior">
      <option value="">全部期望行为</option>
      ${Object.entries(BEHAVIOR_LABEL).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}
    </select>
    <input id="f-text" type="search" placeholder="搜题号或问题…">
    <span class="count" id="f-count"></span>
  </div>`;
}

function bindFilters() {
  const map = {
    "f-bucket": "bucket", "f-difficulty": "difficulty",
    "f-behavior": "behavior", "f-text": "text",
  };
  Object.entries(map).forEach(([id, key]) => {
    const el = $(id);
    if (!el) return;
    el.value = filter[key];
    el.addEventListener("input", () => {
      filter[key] = el.value.trim();
      renderDetails();
    });
    el.addEventListener("change", () => {
      filter[key] = el.value.trim();
      renderDetails();
    });
  });
}

function filteredQuestions() {
  if (!latest) return [];
  const text = filter.text.toLowerCase();
  return latest.questions.filter((q) => {
    if (filter.bucket && q.bucket !== filter.bucket) return false;
    if (filter.difficulty && q.difficulty !== filter.difficulty) return false;
    if (filter.behavior && q.expected_behavior !== filter.behavior) return false;
    if (text && !`${q.id} ${q.query}`.toLowerCase().includes(text)) return false;
    return true;
  });
}

/* ---------- 检索明细 ---------- */

function miniStrategyCell(name, row) {
  const m = row.metrics || {};
  if (!Object.keys(m).length) {
    // D_absent 没有 ground-truth，只统计前 10 条里召回了多少候选
    return `<div>
      <b class="${name === PROD ? "prod" : ""}">${esc(name)}</b>
      <span>无真值 · 前 10 召回 <strong>${(row.hits || []).length}</strong> 条</span>
      ${row.degraded ? tag("降级", "flag") : ""}
    </div>`;
  }
  const rank = row.first_relevant_rank;
  const rankHtml = rank === null
    ? '<span class="rank-miss">首相关未进 top50</span>'
    : `<span class="${rank === 1 ? "rank1" : ""}">首相关 #${rank}</span>`;
  const cov = row.evidence_coverage || {};
  const covHtml = cov.rate === null
    ? '<span>覆盖 —</span>'
    : `<span>覆盖 <strong>${pct(cov.rate, 0)}</strong></span>`;
  return `<div>
    <b class="${name === PROD ? "prod" : ""}">${esc(name)}</b>
    ${rankHtml}
    <span>R@5 <strong>${pct(m["recall@5"], 0)}</strong></span>
    ${covHtml}
    ${row.degraded ? tag("降级", "flag") : ""}
  </div>`;
}

function rankColumn(name, row) {
  const hits = row.hits || [];
  const items = hits.map((hit, index) => `
    <li class="hit ${hit.relevant ? "relevant" : ""}" title="${esc(plainText(hit.answer || ""))}">
      <span class="pos">${index + 1}</span>
      <span class="body">
        <span class="path">${esc(hit.section_path || "(无标题)")}</span>
        <span class="snippet">${formatAnswer(`${hit.question || ""}${hit.question && hit.answer ? " · " : ""}${hit.answer || ""}`)}</span>
      </span>
    </li>`).join("");
  const m = row.metrics || {};
  return `<div class="rank-col">
    <h5 class="${name === PROD ? "prod" : ""}">
      <span>${esc(name)}${row.degraded ? " ⚠" : ""}</span>
      <span>MRR ${num(m["mrr@10"])}</span>
    </h5>
    <ol>${items || '<li class="hit muted">无结果</li>'}</ol>
  </div>`;
}

function retrievalCard(q) {
  const strategies = q.strategies || {};
  const flagged = STRATEGY_ORDER.some((name) => {
    const cov = (strategies[name] || {}).evidence_coverage || {};
    return cov.rate !== null && cov.rate !== undefined && cov.rate < 1;
  });
  const coverageTag = q.bucket === "D_absent"
    ? tag("超范围 · 无真值")
    : flagged ? tag("关键事实有缺失", "flag") : tag("证据覆盖完整", "good");
  const cells = STRATEGY_ORDER.filter((n) => strategies[n])
    .map((name) => miniStrategyCell(name, strategies[name])).join("");
  const columns = STRATEGY_ORDER.filter((n) => strategies[n])
    .map((name) => rankColumn(name, strategies[name])).join("");

  return `<div class="qcard">
    <div class="qhead">
      <span class="qid">${esc(q.id)}</span>
      <span class="qtext">${esc(q.query)}</span>
      ${tag(BUCKET_LABEL[q.bucket] || q.bucket || "—")}
      ${tag(DIFF_LABEL[q.difficulty] || q.difficulty || "—")}
      ${tag(BEHAVIOR_LABEL[q.expected_behavior] || q.expected_behavior || "—")}
      ${coverageTag}
      <button class="open" type="button">展开排序 ▾</button>
    </div>
    <div class="mini">${cells}</div>
    <div class="rankings hidden">${columns}</div>
  </div>`;
}

/* ---------- 答案明细 ---------- */

function answerCard(q) {
  const cov = q.answer_coverage || {};
  const ok = cov.ok;
  const facts = [
    ...(cov.matched || []).filter(t => t).map(t => `<span class="fact ok">✓ ${esc(t)}</span>`),
    ...(cov.missing || []).filter(t => t).map(t => `<span class="fact miss">✗ ${esc(t)}</span>`),
  ].join("");
  const violations = (cov.violations || []).length
    ? `<p class="note bad">负面断言违规：${esc(cov.violations.join("；"))}</p>` : "";
  const faith = q.faithful === null || q.faithful === undefined ? ""
    : `<p class="note ${q.faithful ? "" : "bad"}">忠实度：${q.faithful ? "通过" : "不通过"}${
        q.judge_reason ? ` · ${formatAnswer(q.judge_reason)}` : ""}</p>`;
  const refusal = q.refused
    ? `<p class="note">拒答来源：${esc(q.refusal_source || "—")}${
        q.refusal_reason ? ` · ${esc(q.refusal_reason)}` : ""}</p>` : "";

  return `<div class="acard ${ok ? "" : "bad"}">
    <div class="qhead">
      <span class="qid">${esc(q.id)}</span>
      <span class="qtext">${esc(q.query)}</span>
      ${tag(BUCKET_LABEL[q.bucket] || q.bucket || "—")}
      ${tag(BEHAVIOR_LABEL[q.expected_behavior] || q.expected_behavior || "—")}
      ${ok ? tag("覆盖", "good") : tag("未覆盖", "bad")}
      ${q.degraded ? tag("降级", "flag") : ""}
    </div>
    <div class="answer">${formatAnswer(q.answer || "(空)")}</div>
    ${facts ? `<div class="facts">${facts}</div>` : ""}
    ${violations}${faith}${refusal}
  </div>`;
}

      <div id="answer-list" style="margin-top:14px"></div>

/* ---------- 飞轮评估趋势 ---------- */

const TREND_METRICS = [
  ["faithfulness", "Faithfulness", false],
  ["coverage", "答案覆盖", false],
  ["refusal_accuracy", "拒答正确率", false],
  ["recall_at_5", "Recall@5", false],
  ["misblocked_rate", "误拦率", true],
];

function trendCard() {
  return `<section class="card" id="trend-card">
    <h2>🧭 飞轮评估趋势 <span class="badge">ch04 评估集</span></h2>
    <p class="sub">评估流水线定期跑，防飞轮灌进来的脏知识把指标拉下去。同一评估集写在同一行，
      只有同一集的两轮才比得动；Faithfulness 掉出容差会在这里直接警告。</p>
    <div id="trend-panel"></div>
  </section>`;
}

function renderTrendPanel() {
  const panel = $("trend-panel");
  if (!panel) return;
  panel.innerHTML = trends ? trendBody(trends) : trendEmpty("趋势读不到：服务未就绪。");
}

function trendEmpty(message) {
  return `<div class="empty" style="padding:26px 10px">
    <div class="big">🧭</div>${esc(message)}<br>
    <span class="note">首轮 make eval-flywheel（TRIGGER 默认手动）；之后 TRIGGER=定时 make eval-flywheel。</span>
  </div>`;
}

function trendDelta(delta, lowerIsBetter) {
  if (typeof delta !== "number") return "";
  if (Math.abs(delta) < 0.0005) return `<em class="delta">±0</em>`;
  const good = lowerIsBetter ? delta < 0 : delta > 0;
  return `<em class="delta ${good ? "up" : "down"}">${delta > 0 ? "+" : "−"}${
    (Math.abs(delta) * 100).toFixed(1)}</em>`;
}

function renderRoundCell(round, isLatest) {
  const metrics = round.metrics || {};
  const cmp = round.comparison || {};
  const deltas = cmp.deltas || {};
  let status = "基线（首次记录）";
  let cls = "round-status";
  if (cmp.status === "comparable") {
    status = cmp.warnings && cmp.warnings.length
      ? `与上轮可比 · ${cmp.warnings.length} 条警告` : "与上轮可比";
    if (cmp.warnings && cmp.warnings.length) cls += " warn";
  } else if (cmp.status === "incomparable") {
    status = "不可比：评估集已换，重置基线";
    cls += " warn";
  }
  const rows = TREND_METRICS.map(([key, label, lower]) => `
    <div class="round-metric"><span>${label}</span><b>${pct(metrics[key])}</b>${
      cmp.status === "comparable" ? trendDelta(deltas[key], lower) : ""}</div>`).join("");
  return `<td><div class="round-cell ${isLatest ? "latest" : ""} ${
    cmp.status === "incomparable" ? "flag" : ""}">
    <div class="round-top">
      <span class="round-trigger ${round.trigger === "定时" ? "auto" : ""}">${esc(round.trigger)}</span>
      <span class="round-time">${esc(formatTime(round.finished_at).slice(5))}</span>
    </div>
    ${rows}
    <div class="${cls}" title="${esc(cmp.reason || "")}">${esc(status)}</div>
  </div></td>`;
}

function renderTrendSet(set) {
  const rounds = set.rounds || [];
  const cells = Array.from({ length: trendWidth }, (_, i) => {
    const round = rounds[i];
    return round ? renderRoundCell(round, i === rounds.length - 1) : "<td></td>";
  }).join("");
  const first = rounds[0] || {};
  return `<tr>
    <td class="trend-set"><b>${esc(set.eval_set)}</b>
      <span>${first.sample_count ?? "—"} 题 · 集 ${esc(set.eval_set_hash)}</span></td>
    ${cells}
  </tr>`;
}

function trendBody(data) {
  const sets = data.sets || [];
  if (!sets.length) return trendEmpty("还没有飞轮轮次。");
  const width = Math.max(1, ...sets.map((s) => (s.rounds || []).length));
  trendWidth = width;
  const warnings = (data.warnings || [])
    .map((w) => `<div class="alert">⚠️ ${esc(w)}</div>`).join("");
  return `${warnings}
    <div class="trend-wrap"><table class="trend-table">
      <thead><tr><th>评估集</th><th colspan="${width}">轮次 · 左旧右新（最多最近 6 轮）</th></tr></thead>
      <tbody>${sets.map(renderTrendSet).join("")}</tbody>
    </table></div>
    <p class="note">首轮 <code>make eval-flywheel</code>；定时轮 <code>TRIGGER=定时 make eval-flywheel</code>，
      跑完自动与本集上一轮对比。评估集文件一变，哈希不同，就另起一行、重置基线。</p>`;
}

/* ---------- 置信度阈值校准 ---------- */

function calibrationCard() {
  return `<section class="card" id="cal-card">
    <h2>🎚️ 置信度阈值校准 <span class="badge">ch04 评估集实跑</span></h2>
    <p class="sub">兜底那道闸卡在什么分上，不是拍脑袋定的。拿评估集里可答的和该拒的两拨题
      各算一遍证据置信度，再扫一遍阈值，看哪条线把两拨分得最开。</p>
    <div id="cal-panel"></div>
  </section>`;
}

function renderCalPanel() {
  const panel = $("cal-panel");
  if (!panel) return;
  panel.innerHTML = calibration ? calibrationBody(calibration) : calibrationEmpty();
  bindCalibration();
}

function calibrationEmpty() {
  return `<div class="empty" style="padding:26px 10px">
    <div class="big">🎚️</div>还没有校准产物。点下面按钮跑一轮，或 make calibrate-confidence。
    <div class="cal-run" style="justify-content:center">
      <button id="cal-rerun"${calRunning ? " disabled" : ""}>重跑 置信度阈值校准</button>
      <span id="cal-state" class="cal-run-state">${esc(calStateText())}</span>
    </div>
  </div>`;
}

function calStateText() {
  if (calRunning) return "校准运行中…";
  return "make calibrate-confidence";
}

function calibrationChart(report) {
  const scan = report.scan || {};
  const xs = scan.thresholds || [];
  const pass = scan.pass_rates || [];
  const falsePass = scan.false_pass_rates || [];
  if (xs.length < 2) return "";
  const W = 1000, H = 320, L = 58, R = 26, T = 20, B = 46;
  const xMin = xs[0], xMax = xs[xs.length - 1];
  const x = (t) => L + ((t - xMin) / (xMax - xMin)) * (W - L - R);
  const y = (v) => T + (1 - v) * (H - T - B);
  const line = (values) => values
    .map((v, i) => `${i === 0 ? "M" : "L"}${x(xs[i]).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
  const grid = [0, 0.25, 0.5, 0.75, 1].map((v) => `
    <line class="grid" x1="${L}" y1="${y(v)}" x2="${W - R}" y2="${y(v)}"></line>
    <text x="${L - 10}" y="${y(v) + 4}" text-anchor="end">${v.toFixed(2)}</text>`).join("");
  const ticks = [0.05, 0.2, 0.4, 0.6, 0.8, 0.95].filter((t) => t >= xMin && t <= xMax)
    .map((t) => `<text x="${x(t).toFixed(1)}" y="${H - B + 20}" text-anchor="middle">${
      t.toFixed(2)}</text>`).join("");
  const mark = (t, color, label, dashed = false) => {
    if (typeof t !== "number" || t < xMin || t > xMax) return "";
    const px = x(t).toFixed(1);
    return `<line x1="${px}" y1="${T}" x2="${px}" y2="${H - B}" stroke="${color}"
        stroke-width="${dashed ? 1.6 : 2}"${dashed ? ' stroke-dasharray="5 4"' : ""}></line>
      <text x="${px}" y="${T - 6}" text-anchor="middle" fill="${color}">${label} ${t.toFixed(2)}</text>`;
  };
  // 两条线几乎重合时只画一条，免得标签叠在一起
  const sameLine = Math.abs((report.in_use ?? 0) - (report.recommended ?? 0)) < 0.02;
  return `<svg class="scan-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="阈值扫描曲线">
    ${grid}
    <line class="axis" x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}"></line>
    <text x="${(L + W - R) / 2}" y="${H - 8}" text-anchor="middle">阈值 t</text>
    ${ticks}
    <path d="${line(pass)}" fill="none" stroke="#34b37a" stroke-width="2.2"></path>
    <path d="${line(falsePass)}" fill="none" stroke="#f2678a" stroke-width="2.2"></path>
    ${sameLine ? "" : mark(report.in_use, "#8b5cf6", "在用")}
    ${mark(report.recommended, "#333", sameLine ? "选定/在用" : "选定", true)}
  </svg>`;
}

function nearestScanIndex(report, t) {
  const xs = (report.scan || {}).thresholds || [];
  let best = 0, distance = Infinity;
  xs.forEach((value, index) => {
    const d = Math.abs(value - t);
    if (d < distance) { distance = d; best = index; }
  });
  return best;
}

function calibrationNote(report) {
  const use = report.in_use, rec = report.recommended;
  const atUse = report.at_in_use || {}, atRec = report.at_recommended || {};
  const scan = report.scan || {};
  const parts = [
    `当前在用阈值 <b>${num(use, 2)}</b> 下，应拒放行率 <b>${pct(atUse.false_pass_rate)}</b>、
     可答通过率 <b>${pct(atUse.pass_rate)}</b>。`,
    `数学最优点（推荐阈值 <b>${num(rec, 2)}</b>，Youden J <b>${num(report.youden, 3)}</b>）：
     应拒放行率 <b>${pct(atRec.false_pass_rate)}</b>、可答通过率 <b>${pct(atRec.pass_rate)}</b>。`,
  ];
  if (use !== rec) {
    const looser = use < rec;
    const same = atUse.pass_rate === atRec.pass_rate
      && atUse.false_pass_rate === atRec.false_pass_rate;
    if (same) {
      // 两条线之间没有分数落进来：说「没有变化」比编一句「往右挪」更诚实。
      parts.push(`在用值比推荐值更${looser ? "宽松" : "保守"}（${num(use, 2)} ↔ ${num(rec, 2)}），
        但这组题上没有分数落在两条线之间，指标完全一样。`);
    } else {
      parts.push(`从推荐值往${looser ? "左" : "右"}挪到在用值 ${num(use, 2)}，可答通过率
        ${pct(atRec.pass_rate)} → ${pct(atUse.pass_rate)}，
        误放率 ${pct(atRec.false_pass_rate)} → ${pct(atUse.false_pass_rate)}。`);
    }
  }
  // 以「现在实际在用的那条线」为起点：再往左就是拿多少误放换回多少可答。
  const index = nearestScanIndex(report, use);
  const rates = scan.false_pass_rates || [];
  // 往左找第一条误放率真的抬起来的线；找不到就不说，免得「升到 5.0%」这种原地打转。
  let leftIndex = -1;
  for (let i = index - 1; i >= Math.max(0, index - 10); i -= 1) {
    if (rates[i] > rates[index]) { leftIndex = i; break; }
  }
  if (leftIndex >= 0) {
    parts.push(`再往左放到 ${num(scan.thresholds[leftIndex], 2)}，应拒放行率会升到
      <b>${pct(rates[leftIndex])}</b>。`);
  }
  const zeroIndex = rates.findIndex((rate) => rate === 0);
  if (zeroIndex >= 0 && scan.thresholds[zeroIndex] > rec) {
    parts.push(`要把误放压到 0，线得抬到 <b>${num(scan.thresholds[zeroIndex], 2)}</b>，
      可答通过率只剩 <b>${pct((scan.pass_rates || [])[zeroIndex])}</b>。`);
  }
  parts.push("这条线就是两边代价的拐点；误拦的题走兜底进问题池，成为飞轮的燃料。");
  return `<div class="scan-note">读图：${parts.join(" ")}</div>`;
}

function calibrationBody(report) {
  const use = report.in_use, rec = report.recommended;
  const atUse = report.at_in_use || {};
  const dist = report.distribution || {};
  const relation = use > rec ? "高于推荐值：更保守，误放更少、误拦更多"
    : use < rec ? "低于推荐值：更宽松，可答更多、误放更多" : "与推荐值一致";
  const cards = [
    ["推荐阈值", num(rec, 2), `Youden J ${num(report.youden, 3)} · 两拨分最开的线`],
    ["在用阈值", num(use, 2), relation],
    ["可答通过率", pct(atUse.pass_rate), `库里其实有答案、召回够得着的占比（在用阈值 ${num(use, 2)} 下）`],
    ["应拒放行率", pct(atUse.false_pass_rate), `库外问题被放进来的占比（在用阈值 ${num(use, 2)} 下）`],
  ].map(([label, value, hint]) => `<div class="cal-card">
      <div class="k">${label}</div><div class="v">${value}</div>
      <div class="hint">${hint}</div></div>`).join("");

  const distRows = [
    ["可答（A/B/C/E 桶）", dist.answerable],
    ["应拒（D 桶）", dist.refuse],
  ].map(([label, row]) => `<tr><td>${label}</td><td class="num">${row ? row.count : "—"}</td>
      <td class="num">${num(row && row.min, 3)}</td><td class="num">${num(row && row.p25, 3)}</td>
      <td class="num">${num(row && row.median, 3)}</td><td class="num">${num(row && row.p75, 3)}</td>
      <td class="num">${num(row && row.max, 3)}</td></tr>`).join("");

  const stale = typeof report.in_use_live === "number" && report.in_use_live !== use
    ? `<p class="note warn">配置里的在用阈值已是 ${num(report.in_use_live, 2)}，
        这份产物还是按 ${num(use, 2)} 算的，请重跑校准。</p>` : "";
  const degraded = report.degraded_count
    ? `（另排除 ${report.degraded_count} 题精排降级）` : "";
  const stamp = report.generated_at
    ? `产物生成于 ${esc(formatTime(report.generated_at))} · ${report.sample_count ?? "—"} 题${degraded}`
    : "";

  return `${stale}
    <div class="cal-grid">${cards}</div>
    <div class="trend-wrap"><table style="margin-top:14px">
      <thead><tr><th>题型</th><th class="num">题数</th><th class="num">最低</th>
        <th class="num">p25</th><th class="num">中位</th><th class="num">p75</th>
        <th class="num">最高</th></tr></thead>
      <tbody>${distRows}</tbody>
    </table></div>
    <div class="cal-legend">
      <span><i style="background:#34b37a"></i>可答通过率</span>
      <span><i style="background:#f2678a"></i>应拒放行率</span>
      <span><i class="dash"></i>选定阈值</span>
      <span><i style="background:#8b5cf6"></i>在用阈值</span>
    </div>
    ${calibrationChart(report)}
    ${calibrationNote(report)}
    <div class="explain-grid">
      <div class="explain"><b>置信度怎么算出来的</b>
        四信号加权：Top1 精排分 0.5 / 有效证据数 0.2 / Top1-Top2 分差 0.2 / 关键条款命中 0.1。
        权重是代码里的常量（app/rag/confidence.py），校准校的只是这条线划在哪。</div>
      <div class="explain"><b>什么是「可答被误拦」</b>
        库里其实有答案，但这次召回的证据太差（库里有「猫窝清洗保养说明」，用户问「能扔洗衣机里洗吗」），
        措辞离得远、精排分上不去，置信度掉到线以下。只看证据分不知道「库里有」，于是当成答不上来 ——
        问题落池、归并、审核补进知识库，下次同样问法就能召回，误拦是飞轮的燃料。
        反过来，「误放」是库里没有答案、本该拒答却被放进来，用户拿到编造的话；所以这条线两边都有代价。</div>
    </div>
    <div class="cal-run-title">在页面上重跑</div>
    <div class="cal-run">
      <button id="cal-rerun"${calRunning ? " disabled" : ""}>重跑 置信度阈值校准</button>
      <span class="cap">make calibrate-confidence</span>
      <span id="cal-state" class="cal-run-state">${esc(stamp || calStateText())}</span>
    </div>`;
}

function bindCalibration() {
  const button = $("cal-rerun");
  if (button) button.addEventListener("click", rerunCalibration);
}

async function rerunCalibration() {
  const button = $("cal-rerun");
  if (button) button.disabled = true;
  calRunning = true;
  setCalState("校准启动…");
  try {
    const resp = await fetch("/rag-eval/api/calibrate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    const body = await resp.json().catch(() => ({}));
    if (resp.status === 409) {
      setCalState("已有校准在运行，等它跑完…");
    } else if (!resp.ok) {
      throw new Error(body.detail || `HTTP ${resp.status}`);
    }
    pollCalibration();
  } catch (err) {
    calRunning = false;
    if (button) button.disabled = false;
    setCalState("启动失败：" + err.message, true);
  }
}

async function pollCalibration() {
  let state;
  try {
    state = await fetchJson("/rag-eval/api/calibrate/status");
  } catch (err) {
    calRunning = false;
    setCalState("无法连接服务：" + err.message, true);
    return;
  }
  if (state.status === "running") {
    const progress = state.progress || {};
    setCalState(progress.total ? `${progress.message || "运行中"}（${progress.done}/${progress.total}）`
      : (progress.message || "运行中…"));
    setTimeout(pollCalibration, 1500);
    return;
  }
  calRunning = false;
  if (state.status === "error") {
    setCalState("校准失败：" + (state.error || "未知错误"), true);
    return;
  }
  if (state.status === "done") {
    await loadCalibration();
    setCalState("本轮校准完成，产物已刷新");
  }
}

function setCalState(text, error = false) {
  const el = $("cal-state");
  if (!el) return;
  el.textContent = text;
  el.className = "cal-run-state" + (error ? " error" : "");
}

async function loadTrends() {
  try {
    trends = await fetchJson("/rag-eval/api/trends");
  } catch (err) {
    trends = null;
  }
  renderTrendPanel();
}

async function loadCalibration() {
  try {
    const resp = await fetch("/rag-eval/api/calibration");
    if (resp.status === 404) {
      calibration = null;
    } else if (!resp.ok) {
      throw new Error(`HTTP ${resp.status}`);
    } else {
      calibration = await resp.json();
    }
  } catch (err) {
    calibration = null;
  }
  renderCalPanel();
}

function renderApp() {
  const cards = [trendCard(), calibrationCard()];
  if (!latest) {
    $("content").innerHTML = `<div class="empty"><div class="big">🧪</div>还没有评估结果，点上面的按钮跑一轮。</div>${
      cards.join("")}`;
    renderTrendPanel();
    renderCalPanel();
    return;
  }
  $("content").innerHTML = [
    renderSummary(latest),
    cards[0],
    renderStrategyTable(latest),
    renderQualitySection(latest),
    renderFullData(latest),
    renderAnswerSection(latest),
    renderFaithfulness(latest),
    renderFabrication(latest),
    renderFaithLedger(),
    `<section class="card">
      <h2>🧾 检索明细</h2>
      <p class="sub">每题四策略的排序名次与证据覆盖；点「展开排序」看前 10 条候选，绿色为 ground-truth 相关 chunk。</p>
      ${renderFilterBar()}
      <div id="retrieval-list"></div>
    </section>`,
    cards[1],
  ].join("");
  renderTrendPanel();
  renderCalPanel();
  bindFilters();
  bindQualityTabs();
  bindFabrication();
  renderDetails();
  const ledgerRefresh = $("ledger-refresh");
  if (ledgerRefresh) ledgerRefresh.addEventListener("click", loadFaithLedger);
  loadFaithLedger();
}

/* ---------- 运行状态 ---------- */

function setBusy(busy) {
  $("run-retrieval").disabled = busy;
  $("run-full").disabled = busy;
}

function updateRunState(state) {
  const el = $("run-state");
  const progress = $("progress");
  const bar = $("bar");
  const running = state.status === "running";
  el.className = "run-state" + (running ? " running" : state.status === "error" ? " error" : "");

  if (running) {
    const p = state.progress || {};
    const total = p.total || 0;
    const done = p.done || 0;
    el.textContent = `${p.phase === "answer" ? "生成答案" : p.phase === "retrieval" ? "检索" : "准备"} · ${p.message || ""}${
      total ? `（${done}/${total}）` : ""}`;
    progress.classList.add("show");
    bar.style.width = total ? `${Math.round((done / total) * 100)}%` : "4%";
    setBusy(true);
  } else {
    setBusy(false);
    progress.classList.remove("show");
    if (state.status === "error") {
      el.textContent = `评估失败：${state.error || "未知错误"}`;
    } else if (state.status === "done") {
      el.textContent = "本轮评估完成";
    } else {
      el.textContent = latest ? "就绪" : "还没有运行记录";
    }
  }
}

async function fetchJson(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

async function fetchStatus() {
  return fetchJson("/rag-eval/api/status");
}

async function fetchLatest() {
  const body = await fetchJson("/rag-eval/api/latest");
  latest = body.latest;
  renderApp();
}

async function poll() {
  let state;
  try {
    state = await fetchStatus();
  } catch (err) {
    $("run-state").textContent = "无法连接服务：" + err.message;
    return;
  }
  updateRunState(state);
  if (state.status === "running") {
    wasRunning = true;
    setTimeout(poll, 1500);
  } else if (wasRunning) {
    wasRunning = false;
    await fetchLatest();
  }
}

async function startRun(mode) {
  setBusy(true);
  try {
    const resp = await fetch("/rag-eval/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mode }),
    });
    if (!resp.ok) {
      const body = await resp.json().catch(() => ({}));
      throw new Error(body.detail || `HTTP ${resp.status}`);
    }
    $("run-state").textContent = mode === "full" ? "端到端评估启动…" : "检索评估启动…";
    wasRunning = true;
    setTimeout(poll, 600);
  } catch (err) {
    setBusy(false);
    $("run-state").className = "run-state error";
    $("run-state").textContent = "启动失败：" + err.message;
  }
}

$("run-retrieval").addEventListener("click", () => startRun("retrieval"));
$("run-full").addEventListener("click", () => startRun("full"));

(async function init() {
  try {
    await fetchLatest();
  } catch (err) {
    const detail = err && err.message ? err.message : String(err);
    const text = "无法连接服务：" + detail +
      "（请确认已启动 uvicorn，并通过 http://127.0.0.1:8000/rag-eval 打开）";
    const el = $("run-state");
    el.className = "run-state error";
    el.textContent = text;
    const box = document.createElement("div");
    box.className = "empty";
    const big = document.createElement("div");
    big.className = "big";
    big.textContent = "🔌";
    const msg = document.createElement("div");
    msg.textContent = text;
    box.append(big, msg);
    $("content").replaceChildren(box);
    return;
  }
  await Promise.all([loadTrends(), loadCalibration()]);
  const state = await fetchStatus().catch(() => null);
  if (state) {
    updateRunState(state);
    if (state.status === "running") {
      wasRunning = true;
      setTimeout(poll, 1200);
    }
  }
  const calSnapshot = await fetchJson("/rag-eval/api/calibrate/status").catch(() => null);
  if (calSnapshot && calSnapshot.status === "running") {
    calRunning = true;
    const button = $("cal-rerun");
    if (button) button.disabled = true;
    pollCalibration();
  }
})();
</script>
</body>
