<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知序 · 智能客服</title>
<style>
  :root {
    --brand: #ff6f3c;
    --brand-2: #ff9a5a;
    --bg: #fff7f0;
    --panel: #ffffff;
    --ink: #3a3a3a;
    --muted: #9b9b9b;
    --user-bubble: linear-gradient(135deg, #ff6f3c, #ff8a5a);
    --assistant-bubble: #ffffff;
    --border: #f0e6dd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }

  .shell {
    max-width: 1080px;
    height: 100vh;
    margin: 0 auto;
    display: flex;
    background: var(--panel);
    box-shadow: 0 0 40px rgba(255, 111, 60, 0.08);
  }
  .sidebar {
    width: 252px;
    flex: none;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    background: #fffdfa;
  }
  .sidebar-head {
    padding: 16px 14px 10px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .conversation-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .conversation-item {
    width: 100%;
    text-align: left;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 10px;
    padding: 9px 10px;
    margin-bottom: 4px;
    cursor: pointer;
    color: var(--ink);
  }
  .conversation-item:hover { background: #fff2ea; }
  .conversation-item.active { background: #fff1e6; border-color: #ffd7bf; }
  .conversation-item:disabled { opacity: .55; cursor: default; }
  .conv-preview {
    display: block; font-size: 13px; line-height: 1.4;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .conv-meta {
    display: flex; gap: 6px; margin-top: 4px;
    font-size: 11px; color: var(--muted);
  }
  .conv-badge {
    color: var(--brand); border: 1px solid #ffd7bf;
    border-radius: 8px; padding: 0 5px;
  }
  .sidebar-toggle { display: none; }
  .sidebar-backdrop { display: none; }
  @media (max-width: 720px) {
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 252px;
      z-index: 30;
      transform: translateX(-105%);
      transition: transform .2s ease;
      box-shadow: 8px 0 24px rgba(0, 0, 0, .12);
    }
    .sidebar.open { transform: none; }
    .sidebar-toggle {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 8px;
      padding: 5px 9px;
      font-size: 12px;
      cursor: pointer;
    }
    .sidebar-backdrop.show {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .25);
      z-index: 20;
    }
  }
  .app {
    flex: 1;
    min-width: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
  }

  /* 顶栏 */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    background: linear-gradient(135deg, #ff6f3c, #ff8a5a);
    color: #fff;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .brand h1 { font-size: 18px; font-weight: 600; }
  .status { font-size: 12px; opacity: 0.92; display: flex; align-items: center; gap: 5px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #6df08a; display: inline-block;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:.35} }

  .btn-new {
    border: 1px solid rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.14);
    color: #fff;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-new:hover { background: rgba(255,255,255,0.28); }
  .header-actions { display: flex; align-items: center; gap: 8px; }
  a.btn-new { text-decoration: none; display: inline-flex; align-items: center; }

  /* 消息区 */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { display: flex; align-items: flex-end; gap: 10px; }
  .msg .avatar {
    width: 34px; height: 34px; flex: none;
    border-radius: 50%;
    background: #fff2ea;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .bubble {
    max-width: 72%;
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble {
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  }

  /* 客服 Markdown 渲染样式 */
  .msg.assistant .body p { margin: 0 0 8px; }
  .msg.assistant .body p:last-child { margin-bottom: 0; }
  .msg.assistant .body ul,
  .msg.assistant .body ol { margin: 4px 0 8px; padding-left: 20px; }
  .msg.assistant .body li { margin: 2px 0; }
  .msg.assistant .body strong { font-weight: 600; }
  .msg.assistant .body em { font-style: italic; }
  .msg.assistant .body code {
    background: #f5efe9;
    padding: 1px 5px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.9em;
  }
  .msg.assistant .body h2, .msg.assistant .body h3, .msg.assistant .body h4,
  .msg.assistant .body h5, .msg.assistant .body h6 {
    margin: 10px 0 4px; font-weight: 600;
  }
  .msg.assistant .body h2 { font-size: 1.25em; }
  .msg.assistant .body h3 { font-size: 1.1em; }
  .msg.assistant .body h4 { font-size: 1em; }
  /* 满意度反馈（纯前端 state，不发请求、不落库） */
  .feedback {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    margin-top: 8px;
    padding: 1px 4px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fffdfa;
  }
  .fb-btn {
    border: 1px solid transparent;
    background: transparent;
    padding: 1px 5px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.4;
    cursor: pointer;
    opacity: .7;
    transition: opacity .15s ease, background .15s ease;
  }
  .fb-btn:hover { background: #fff1e6; opacity: 1; }
  .fb-btn.active { color: var(--brand); font-weight: 600; opacity: 1; }
  .feedback.locked .fb-btn:not(.active) { opacity: .35; cursor: default; }
  .fb-tip { font-size: 12px; color: var(--muted); }

  /* ---- ch05 动作按钮与工单弹窗 ---- */
  .action-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px dashed var(--border);
  }
  .action-btn {
    border: 1px solid var(--brand);
    background: #fff1e6;
    color: var(--brand);
    padding: 5px 14px;
    border-radius: 16px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease, opacity .15s ease;
  }
  .action-btn:hover { background: var(--brand); color: #fff; }
  .action-btn:disabled { opacity: .45; cursor: default; background: #f3f3f3; color: var(--muted); border-color: #ddd; }

  .system-notice {
    align-self: center;
    padding: 2px 10px;
    border-radius: 10px;
    background: #f5f5f5;
    color: var(--muted);
    font-size: 12px;
  }

  .modal-mask {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, .32);
  }
  .ticket-modal {
    width: min(430px, calc(100vw - 32px));
    background: #fff;
    border-radius: 14px;
    padding: 18px 18px 14px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .2);
  }
  .ticket-modal h3 { margin: 0 0 14px; font-size: 17px; }
  .ticket-modal label { display: block; margin: 10px 0 0; font-size: 13px; color: #666; }
  .ticket-modal select,
  .ticket-modal textarea {
    width: 100%;
    margin-top: 5px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    background: #fbf7f3;
    outline: none;
  }
  .ticket-modal textarea { resize: vertical; min-height: 86px; }
  .ticket-modal select:focus,
  .ticket-modal textarea:focus { border-color: var(--brand-2); background: #fff; }
  .ticket-modal .modal-error { min-height: 18px; margin-top: 6px; color: #d93a3a; font-size: 12px; }
  .ticket-modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .ticket-modal .modal-actions button {
    border: 1px solid var(--border);
    background: #fff;
    color: #555;
    padding: 7px 16px;
    border-radius: 18px;
    font-size: 14px;
    cursor: pointer;
  }
  .ticket-modal .modal-actions button#ticketSubmit {
    border-color: var(--brand);
    background: var(--brand);
    color: #fff;
  }
  .ticket-modal .modal-actions button:disabled { opacity: .5; cursor: not-allowed; }

  .order-cards { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .order-prompt { font-size: 13px; color: #666; }
  .order-card {
    display: flex; flex-direction: column; gap: 3px; text-align: left;
    padding: 10px 12px; border: 1px solid #e4ddd2; border-radius: 10px;
    background: #fff; cursor: pointer;
  }
  .order-card:hover { border-color: var(--brand-2); }
  .order-card:disabled { opacity: .55; cursor: not-allowed; }
  .order-card strong { font-size: 14px; }
  .order-card span { font-size: 12px; color: #777; }

  /* ---- ch08 工单确认预览卡片 ---- */
  .ticket-preview {
    margin-top: 10px;
    padding: 12px 14px;
    border: 1px solid #e4ddd2;
    border-radius: 12px;
    background: #fffdfa;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .ticket-preview-head { font-size: 14px; font-weight: 600; color: var(--ink); }
  .ticket-preview-field { display: flex; gap: 8px; align-items: baseline; font-size: 13px; line-height: 1.55; }
  .ticket-preview-label { flex: none; min-width: 56px; color: var(--muted); }
  .ticket-preview-value { color: var(--ink); word-break: break-word; white-space: pre-wrap; }
  .ticket-preview-actions { display: flex; gap: 8px; margin-top: 2px; }
  .ticket-preview-btn {
    border: 1px solid var(--brand);
    background: #fff1e6;
    color: var(--brand);
    padding: 6px 16px;
    border-radius: 16px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease, opacity .15s ease;
  }
  .ticket-preview-btn:hover { background: var(--brand); color: #fff; }
  .ticket-preview-btn.confirm { border-color: var(--brand); background: var(--brand); color: #fff; }
  .ticket-preview-btn.confirm:hover { background: #e65a2b; }
  .ticket-preview-btn:disabled { opacity: .5; cursor: not-allowed; }
  .ticket-preview-status { font-size: 12px; color: var(--muted); min-height: 16px; }
  .ticket-preview-status.ok { color: #2e9e5b; }
  .ticket-preview-status.warn { color: #c98a00; }
  .ticket-preview-status.invalid { color: #d93a3a; }

  .bubble .error { color: #d93a3a; margin-top: 6px; }

  /* 流式光标 */
  .cursor {
    display: inline-block;
    width: 2px; height: 1em;
    margin-left: 2px;
    vertical-align: -2px;
    background: var(--brand);
    animation: blink 1s steps(2, start) infinite;
  }
  @keyframes blink { to { visibility: hidden; } }

  /* 输入区 */
  .composer {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 14px 18px;
    border-top: 1px solid var(--border);
    background: #fff;
  }
  .composer textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 11px 16px;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.5;
    max-height: 120px;
    outline: none;
    background: #fbf7f3;
  }
  .composer textarea:focus { border-color: var(--brand-2); background: #fff; }
  .composer button {
    border: none;
    background: var(--brand);
    color: #fff;
    padding: 12px 22px;
    border-radius: 22px;
    font-size: 15px;
    cursor: pointer;
    transition: opacity .15s;
  }
  .composer button:hover { opacity: .88; }
  .composer button:disabled { opacity: .5; cursor: not-allowed; }

  .tool-badge {
    display: inline-block;
    margin: 0 0 6px;
    padding: 3px 10px;
    border-radius: 12px;
    background: #fff1e6;
    color: #ff6f3c;
    border: 1px solid #ffd7bf;
    font-size: 12px;
  }
  /* ---- 引用编号与便利贴 ---- */
  .cite-chip {
    display: inline-block;
    margin: 0 1px;
    padding: 0 5px;
    border: 1px solid var(--brand);
    border-radius: 999px;
    background: #fff1e6;
    color: var(--brand);
    font-size: 12px;
    line-height: 18px;
    cursor: pointer;
    vertical-align: 1px;
  }
  .cite-chip:hover { background: var(--brand); color: #fff; }
  .cite-chip.missing {
    border-color: #ddd;
    background: #f3f3f3;
    color: var(--muted);
    cursor: default;
  }

  .cite-sticky {
    position: fixed;
    z-index: 50;
    width: min(340px, calc(100vw - 24px));
    max-height: 60vh;
    overflow: auto;
    box-sizing: border-box;
    padding: 14px 16px 16px;
    background: #fff7c2;
    border: 1px solid #f0e08a;
    border-radius: 4px 4px 3px 14px;
    box-shadow: 0 10px 26px rgba(120, 100, 0, .22), 0 2px 4px rgba(0, 0, 0, .08);
    transform: rotate(-.6deg);
    color: #5a4a00;
    font-size: 13px;
    line-height: 1.55;
    animation: stickyIn .14s ease-out;
  }
  @keyframes stickyIn {
    from { opacity: 0; transform: rotate(-.6deg) translateY(4px) scale(.98); }
    to   { opacity: 1; transform: rotate(-.6deg) translateY(0) scale(1); }
  }
  .cite-sticky::after {           /* 便利贴底部卷角 */
    content: '';
    position: absolute;
    right: 0;
    bottom: 0;
    width: 18px;
    height: 18px;
    background: linear-gradient(135deg, transparent 50%, #f3e57d 50%);
    border-radius: 0 0 14px 0;
  }
  .cite-sticky .sticky-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    font-weight: 700;
    color: #6b5700;
  }
  .cite-sticky .sticky-close {
    flex: none;
    border: 0;
    background: transparent;
    color: #9a8400;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 0 2px;
  }
  .cite-sticky .sticky-close:hover { color: #3d3300; }
  .cite-sticky .sticky-source { margin: 6px 0 0; font-size: 11px; color: #9a8400; }
  .cite-sticky .sticky-body {
    margin: 8px 0 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: inherit;
    font-size: 13px;
    color: #4f4300;
  }
</style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <span>历史会话</span>
        <span id="sidebarStatus"></span>
      </div>
      <div class="conversation-list" id="conversationList"></div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="app">
      <header class="header">
        <button class="sidebar-toggle" id="btnSidebar" type="button">会话</button>
        <div class="brand">
          <div class="avatar">🐱</div>
          <div>
            <h1>知序智能客服</h1>
            <p class="status"><span class="dot"></span>在线 · 纯对话体验版</p>
          </div>
        </div>
        <div class="header-actions">
          <a class="btn-new" href="/rag-eval">评估面板</a>
          <button class="btn-new" id="btnNew">新对话</button>
        </div>
      </header>

      <main class="chat" id="chat"></main>

      <footer class="composer">
        <textarea id="input" rows="1" placeholder="请输入您的问题，回车发送（Shift+回车换行）"></textarea>
        <button id="send">发送</button>
      </footer>
    </div>
  </div>

<script>
  // 本轮工具徽章：一次 ReAct 可能连续调用多个工具（如先 query_order 再 query_logistics），
  // 必须累积展示，后一个不能把前一个覆盖掉。
  function mergeToolBadge(prevNames, name) {
    const names = prevNames ? prevNames.slice() : [];
    if (!names.includes(name)) names.push(name);
    return { names, text: '🔧 调用了 ' + names.join('、') };
  }
</script>
<script>
(() => {
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendEl = document.getElementById('send');
  const btnNew = document.getElementById('btnNew');
  const conversationListEl = document.getElementById('conversationList');
  const sidebarStatusEl = document.getElementById('sidebarStatus');
  const sidebarEl = document.getElementById('sidebar');
  const sidebarBackdropEl = document.getElementById('sidebarBackdrop');
  const btnSidebar = document.getElementById('btnSidebar');

  function uuid() {
    if (crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    // 非安全上下文（如局域网 IP 直接访问）的兜底
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
      const r = (Math.random() * 16) | 0;
      return (c === 'x' ? r : (r & 0x3) | 0x8).toString(16);
    });
  }

  let sessionId = null;
  let sending = false;
  let conversations = [];
  let historyRequestToken = 0;

  function scrollToBottom() {
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  // ---- Markdown 渲染（客服回复用，覆盖模型常输出的 **粗体** / - 列表 / 1. 列表 / # 标题 / 行内代码）----
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 小节标题前配一个 emoji，正文解释不加。
  // 标题形如「**退货政策**」或「### 退货政策」，按标题里命中的关键词选图标。
  const KEYWORD_EMOJI = [
    ['退货', '📦'], ['退换货', '🔄'], ['换货', '🔄'], ['退款', '💰'],
    ['处理时效', '⏱️'], ['时效', '⏱️'], ['运费', '🚚'], ['包邮', '📦'],
    ['发票', '🧾'], ['保修', '🔧'], ['积分', '⭐'], ['会员', '👑'],
    ['发货', '📮'], ['物流', '🚚'], ['破损', '⚠️'], ['优惠券', '🎟️'],
  ];

  function decorateTitle(text) {
    const trimmed = text.trimStart();
    const cp = trimmed ? trimmed.codePointAt(0) : 0;
    const isEmoji = (cp >= 0x1F000 && cp <= 0x1FAFF) || (cp >= 0x2190 && cp <= 0x23FF)
      || (cp >= 0x2600 && cp <= 0x27BF) || (cp >= 0x2B00 && cp <= 0x2BFF);
    if (isEmoji) return text; // 模型已经带了 emoji 就不重复

    const plain = text.replace(/^\s*\d+[.)]\s*/, ''); // 找关键词时忽略序号
    let best = null;
    for (const [kw, emoji] of KEYWORD_EMOJI) {
      const idx = plain.indexOf(kw);
      if (idx === -1) continue;
      if (!best || idx < best.idx || (idx === best.idx && kw.length > best.len)) {
        best = { idx, len: kw.length, emoji };
      }
    }
    return best ? best.emoji + ' ' + text.trimStart() : text;
  }

  function inlineMd(s) {
    let out = escapeHtml(s);
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');                 // 行内代码（先处理）
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');      // 加粗
    out = out.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');  // 斜体（单 *）
    return out;
  }

  function renderMarkdown(text) {
    if (!text) return '';
    const lines = text.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let list = null; // 'ul' | 'ol' | null
    let para = [];

    const closeList = () => { if (list) { html += '</' + list + '>'; list = null; } };
    const flushPara = () => {
      if (para.length) { html += '<p>' + para.map(inlineMd).join('<br>') + '</p>'; para = []; }
    };

    for (const rawLine of lines) {
      const line = rawLine.trimEnd();
      const head = line.match(/^\s*(#{1,6})\s+(.*)$/);
      const section = line.match(/^\s*\*\*([^*]+)\*\*\s*[:：]?\s*$/); // 独占一行的加粗行，按小节标题处理
      const ul = line.match(/^\s*[-*]\s+(.*)$/);
      const ol = line.match(/^\s*(\d+)[.)]\s+(.*)$/);

      if (!line.trim()) { flushPara(); closeList(); continue; }

      if (head) {
        flushPara(); closeList();
        const lv = Math.min(head[1].length + 1, 6); // # → h2
        html += '<h' + lv + '>' + inlineMd(decorateTitle(head[2])) + '</h' + lv + '>';
        continue;
      }
      if (section) {
        flushPara(); closeList();
        html += '<h4>' + inlineMd(decorateTitle(section[1])) + '</h4>';
        continue;
      }
      if (ul) {
        flushPara();
        if (list !== 'ul') { closeList(); html += '<ul>'; list = 'ul'; }
        html += '<li>' + inlineMd(ul[1]) + '</li>';
        continue;
      }
      if (ol) {
        flushPara();
        if (list !== 'ol') { closeList(); html += '<ol>'; list = 'ol'; }
        html += '<li>' + inlineMd(ol[2]) + '</li>';
        continue;
      }
      closeList();
      para.push(line);
    }
    flushPara();
    closeList();
    return html;
  }

  // 解析单行 SSE 事件（形如 `data: {...}`）
  function handleLine(line, bubbleEl, ctx) {
    const s = line.trim();
    if (!s.startsWith('data:')) return;
    const payload = s.slice(5).trim();
    if (!payload) return;
    let ev;
    try { ev = JSON.parse(payload); } catch { return; }
    switch (ev.type) {
      case 'session':
        sessionId = String(ev.session_id);
        loadConversations();
        break;
      case 'tool_status': {
        const merged = mergeToolBadge(ctx.toolNames, ev.name);
        ctx.toolNames = merged.names;
        if (!ctx.badge) {
          ctx.badge = document.createElement('div');
          ctx.badge.className = 'tool-badge';
          bubbleEl.insertBefore(ctx.badge, bubbleEl.firstChild);
        }
        ctx.badge.textContent = merged.text;
        break;
      }
      case 'citations':
        ctx.citations = ev.items || [];
        break;
      case 'actions':
        ctx.actions = ev.items || [];
        break;
      case 'token':
        ctx.raw += ev.content;
        ctx.stream.textContent += ev.content; // 流式阶段纯文本逐字
        scrollToBottom();
        break;
      case 'error':
        finalizeAssistant(bubbleEl, ctx);
        appendError(bubbleEl, ev.message);
        break;
      case 'done':
        finalizeAssistant(bubbleEl, ctx);
        refreshAfterDone();
        break;
    }
  }

  // 把答案正文里的 [n] 变成可点标记；没有对应引用时保留灰色不可点样式
  function linkifyCitations(body, citations) {
    if (!citations || !citations.length) return;
    const byN = new Map(citations.map((c) => [c.n, c]));
    const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
    const targets = [];
    while (walker.nextNode()) {
      if (/\[\d+\]/.test(walker.currentNode.nodeValue)) targets.push(walker.currentNode);
    }
    for (const node of targets) {
      const frag = document.createDocumentFragment();
      let last = 0;
      const text = node.nodeValue;
      for (const m of text.matchAll(/\[(\d+)\]/g)) {
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        const item = byN.get(Number(m[1]));
        const chip = document.createElement(item ? 'button' : 'span');
        chip.textContent = m[0];
        chip.className = item ? 'cite-chip' : 'cite-chip missing';
        if (item) chip.addEventListener('click', () => openCitation(item, chip));
        frag.appendChild(chip);
        last = m.index + m[0].length;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  }

  // 点引用编号 → 在编号旁边贴一张「便利贴」，显示章节路径 + 来源 + chunk 原文
  let stickyEl = null;

  function closeCitation() {
    if (stickyEl) {
      stickyEl.remove();
      stickyEl = null;
    }
  }

  function openCitation(item, anchor) {
    closeCitation();
    const sticky = document.createElement('div');
    sticky.className = 'cite-sticky';

    const head = document.createElement('div');
    head.className = 'sticky-head';
    const title = document.createElement('span');
    title.textContent = item.section_path || '(无章节路径)';
    const close = document.createElement('button');
    close.type = 'button';
    close.className = 'sticky-close';
    close.setAttribute('aria-label', '关闭');
    close.textContent = '×';
    close.addEventListener('click', closeCitation);
    head.append(title, close);

    const source = document.createElement('p');
    source.className = 'sticky-source';
    source.textContent = item.source_file ? `来源文档：${item.source_file}` : '';

    const body = document.createElement('p');
    body.className = 'sticky-body';
    body.textContent = item.answer || '';

    sticky.append(head, source, body);
    sticky.style.visibility = 'hidden';
    document.body.appendChild(sticky);
    stickyEl = sticky;

    // 就近贴：优先在编号下方，空间不够就翻到上方，左右夹在视口内
    const pad = 12;
    const gap = 8;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const w = sticky.offsetWidth;
    const h = sticky.offsetHeight;
    const rect = anchor.getBoundingClientRect();
    let left = rect.left + rect.width / 2 - w / 2;
    left = Math.max(pad, Math.min(left, vw - w - pad));
    let top = rect.bottom + gap;
    if (top + h > vh - pad) {
      const above = rect.top - h - gap;
      top = above >= pad ? above : Math.max(pad, vh - h - pad);
    }
    sticky.style.left = `${left}px`;
    sticky.style.top = `${top}px`;
    sticky.style.visibility = 'visible';
  }

  // 每条正常完成的助手回答下方挂 👍/👎；纯前端一次性状态，不发请求、不落库
  function attachFeedback(msgEl) {
    if (!msgEl || msgEl.querySelector('.feedback')) return;
    const box = document.createElement('div');
    box.className = 'feedback';
    const tip = document.createElement('span');
    tip.className = 'fb-tip';
    const state = { value: null };
    const mk = (kind, label) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'fb-btn';
      button.dataset.kind = kind;
      button.setAttribute('aria-label', kind === 'up' ? '满意' : '不满意');
      button.textContent = label;
      button.addEventListener('click', () => {
        if (state.value) return; // 一次性锁定：同一条只能反馈一次
        state.value = kind;
        box.classList.add('locked');
        box.querySelectorAll('.fb-btn').forEach((b) => {
          b.classList.toggle('active', b.dataset.kind === kind);
        });
        tip.textContent = '已反馈';
      });
      return button;
    };
    box.appendChild(mk('up', '👍'));
    box.appendChild(mk('down', '👎'));
    box.appendChild(tip);
    msgEl.appendChild(box);
  }

  // 收尾：把流式纯文本换成 Markdown 渲染后的 HTML

    if (ctx.finished) return;

    bubbleEl.appendChild(body);
    attachFeedback(bubbleEl);
    renderActions(bubbleEl, ctx.actions);
    scrollToBottom();
  }

    async function recoverFromError() {
      try {
        const resp = await fetch('/api/conversations/' + sessionId + '/messages');
        if (!resp.ok) { markInvalid(); return; }
        const data = await resp.json();
        const pa = data.pending_action;
        if (pa && pa.type === 'ticket_preview'
            && String(pa.confirmation_id) === confirmationId) {
          decided = false;
          confirmBtn.disabled = false;
          cancelBtn.disabled = false;
          setStatus('网络异常，请重试', 'warn');
        } else {
          markInvalid();
        }
      } catch (e) {
        markInvalid();
      }
    }

    // ctx.raw 没拼出工单号时，回查历史里最新的助手消息。
    async function findTicketInHistory() {
      try {
        const resp = await fetch('/api/conversations/' + sessionId + '/messages');
        if (!resp.ok) return null;
        const data = await resp.json();
        for (const m of (data.messages || []).slice().reverse()) {
          if (m.role !== 'assistant') continue;
          const match = (m.content || '').match(TICKET_NO_RE);
          if (match) return match[0];
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    async function submitDecision(decision) {
      if (decided) return; // 快速双击/重复点击防护：只发一次
      decided = true;
      confirmBtn.disabled = true;
      cancelBtn.disabled = true;
      setStatus(decision === 'confirm' ? '提交中…' : '取消中…');
      setSending(true);
      try {
        let resp;
        try {
          resp = await fetch('/chat/ticket/resume', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              session_id: String(sessionId),
              confirmation_id: confirmationId,
              decision,
            }),
          });
        } catch (e) {
          await recoverFromError();
          return;
        }
        if (!resp.ok) {
          if (resp.status === 409 || resp.status === 404) markInvalid();
          else await recoverFromError();
          return;
        }

        const { bubble } = addAssistantMessage('');
        const stream = document.createElement('span');
        stream.className = 'stream';
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        bubble.innerHTML = '';
        bubble.appendChild(stream);
        bubble.appendChild(cursor);
        const ctx = { raw: '', stream, finished: false, citations: [], actions: [] };
        try {
          await consumeStream(resp, bubble, ctx);
        } catch (e) {
          finalizeAssistant(bubble, ctx);
          appendError(bubble, e.message);
          await recoverFromError();
          return;
        }

        if (decision === 'confirm') {
          const found = ctx.raw.match(TICKET_NO_RE);
          const ticketNo = found ? found[0] : await findTicketInHistory();
          setStatus(ticketNo ? '工单号 ' + ticketNo : '已提交确认，请查看上方回复', 'ok');
        } else {
          setStatus('已取消，本次未创建工单', 'ok');
        }
        scrollToBottom();
      } finally {
        setSending(false);
      }
    }

    confirmBtn.addEventListener('click', () => submitDecision('confirm'));
    cancelBtn.addEventListener('click', () => submitDecision('cancel'));
  }

  function renderActions(bubbleEl, items) {
    if (!items || !items.length) return;
    const bar = document.createElement('div');
    bar.className = 'action-bar';
    for (const item of items) {
      if (item.type === 'select_order') {
        renderOrderCards(bubbleEl, item);
        return;
      }
      if (item.type === 'ticket_preview') {
        renderTicketPreview(bubbleEl, item);
        return;
      }
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'action-btn';
      button.textContent = item.label || (item.type === 'transfer_human' ? '转人工' : '建工单');
      if (item.type === 'transfer_human') {
        button.addEventListener('click', () => transferHuman(button));
      } else if (item.type === 'create_ticket') {
        button.addEventListener('click', () => openTicketModal(button));
      } else if (item.type === 'refund_form') {
        button.textContent = item.label || '提交退款单';
        button.addEventListener('click', () => openRefundModal(button, item));
      }
      bar.appendChild(button);
    }
    if (bar.childElementCount) bubbleEl.appendChild(bar);
  }

  function appendError(bubbleEl, message) {
    const err = document.createElement('div');
    err.className = 'error';
    err.textContent = '[出错了] ' + message;
    bubbleEl.appendChild(err);
    scrollToBottom();
  }

  async function consumeStream(resp, bubble, ctx) {
    if (!resp.ok || !resp.body) {
      throw new Error('请求失败（HTTP ' + resp.status + '）');
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buf = '';
    const flush = () => {
      const lines = buf.split('\n');
      buf = lines.pop() ?? '';
      for (const line of lines) handleLine(line, bubble, ctx);
    };
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      flush();
    }
    buf += decoder.decode();
    flush();
    if (buf.trim()) handleLine(buf.trim(), bubble, ctx);
    if (!ctx.finished) finalizeAssistant(bubble, ctx);
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || sending) return;

    addUserMessage(text);
    inputEl.value = '';
    autoGrow();

    const { bubble } = addAssistantMessage('');
    const stream = document.createElement('span');
    stream.className = 'stream';
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    bubble.innerHTML = '';
    bubble.appendChild(stream);
    bubble.appendChild(cursor);

    const ctx = { raw: '', stream, finished: false, citations: [], actions: [] };
    setSending(true);

    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });
      await consumeStream(resp, bubble, ctx);
    } catch (e) {
      finalizeAssistant(bubble, ctx);
      appendError(bubble, e.message);
    } finally {
      setSending(false);
    }
  }

  sendEl.addEventListener('click', send);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  inputEl.addEventListener('input', autoGrow);
  btnNew.addEventListener('click', reset);

  // 点便利贴外面 / 按 Esc / 滚动聊天区时收起
  document.addEventListener('click', (e) => {
    if (e.target.closest('.cite-sticky') || e.target.closest('.cite-chip')) return;
    closeCitation();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeCitation();
  });
  chatEl.addEventListener('scroll', closeCitation, { passive: true });
  window.addEventListener('resize', closeCitation);

  btnSidebar.addEventListener('click', openSidebar);
  sidebarBackdropEl.addEventListener('click', closeSidebar);

  reset();
  loadConversations();
})();
</script>
