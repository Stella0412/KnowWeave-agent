<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知序 · 数据飞轮待审队列</title>
<style>
  :root { color-scheme: light; --line:#d8dee9; --muted:#667085; --accent:#2563eb; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; color:#1f2937; background:#f7f8fa; }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  header a { color:var(--accent); text-decoration:none; }
  main { display:grid; grid-template-columns:minmax(320px,420px) 1fr; gap:16px; padding:16px 20px 40px; }
  section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:#b42318; }
  button:disabled { opacity:.55; cursor:default; }
  .queue-item { width:100%; text-align:left; margin-bottom:8px; padding:10px; }
  .queue-item .summary { display:block; font-weight:600; margin-bottom:4px; }
  .meta { color:var(--muted); font-size:12px; display:flex; gap:8px; flex-wrap:wrap; }
  .badge { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:0 7px; font-size:12px; }
  .evidence { border-radius:6px; padding:8px 10px; margin:8px 0; }
  .evidence.has_snippets { background:#ecfdf3; border:1px solid #abefc6; }
  .evidence.empty { background:#fffaeb; border:1px solid #fedf89; }
  .evidence.missing { background:#f2f4f7; border:1px solid #d0d5dd; }
  .occurrence { border-top:1px solid var(--line); padding:10px 0; }
  .snippet { background:#f8fafc; border-left:3px solid var(--line); padding:6px 8px; margin:6px 0; white-space:pre-wrap; }
  textarea, input, select { width:100%; font:inherit; padding:7px 8px; border:1px solid var(--line); border-radius:6px; }
  textarea { min-height:88px; resize:vertical; }
  .form-row { margin-bottom:8px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  #notice { min-height:22px; margin:8px 0; color:var(--muted); white-space:pre-wrap; }
  #metrics { margin-top:14px; border-top:1px solid var(--line); padding-top:10px; }
  .muted { color:var(--muted); }
  @media (max-width:860px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>数据飞轮 · 待审队列</h1>
  <a href="/">聊天页</a>
  <a href="/observability">观测与成本</a>
  <button id="refresh">刷新</button>
</header>
<main>
  <section>
    <div class="toolbar" id="tabs">
      <button data-status="待处理" class="active">待处理</button>
      <button data-status="已关闭">已关闭</button>
      <button data-status="已忽略">已忽略</button>
    </div>
    <div id="queue" class="muted">加载中…</div>
    <div id="queue-total" class="meta"></div>
  </section>
  <section id="detail-panel">
    <div id="notice"></div>
    <div id="detail" class="muted">从左侧选择一条问题。</div>
    <div id="metrics"></div>
  </section>
</main>
<script>
"use strict";

const state = { status: "待处理", selected: null, detail: null };

function node(tag, className, text) {
  const item = document.createElement(tag);
  if (className) item.className = className;
  if (text !== undefined && text !== null) item.textContent = String(text);
  return item;
}

function setNotice(text, error) {
  const box = document.getElementById("notice");
  box.textContent = text || "";
  box.style.color = error ? "#b42318" : "";
}

async function api(path, options) {
  const response = await fetch(path, options);
  let body = null;
  try { body = await response.json(); } catch (_) { body = null; }
  if (!response.ok) {
    const detail = body && (body.detail || body.error) || ("HTTP " + response.status);
    const error = new Error(detail);
    error.status = response.status;
    error.orphanId = body && body.orphan_id;
    error.rootId = body && body.root_id;
    throw error;
  }
  return body;
}

function evidenceText(value) {
  if (value === "has_snippets") return "有引用片段：知识库检到了内容，但回答没过门槛。";
  if (value === "empty") return "引用为空：这一轮走了检索，但没有可用片段。";
  if (value === "missing") return "没有引用快照：这一轮没有走检索，无法判断是否缺知识。";
  return "未知证据状态：" + String(value);
}

function renderQueue(items, total) {
  const list = document.getElementById("queue");
  list.replaceChildren();
  list.className = "";
  if (!items.length) {
    list.append(node("p", "muted", "当前状态下没有待审问题。"));
  }
  for (const item of items) {
    const button = node("button", "queue-item");
    button.addEventListener("click", () => loadDetail(item.id));
    button.append(node("span", "summary", item.raw_question || "（空问题）"));
    const meta = node("span", "meta");
    meta.append(node("span", "badge", "出现 " + item.duplicate_count + " 次"));
    meta.append(node("span", "", item.status || ""));
    const sources = Object.entries(item.sources || {})
      .map(([name, count]) => name + "×" + count).join(" · ");
    if (sources) meta.append(node("span", "", sources));
    if (item.last_seen_at) meta.append(node("span", "", "最近 " + item.last_seen_at.replace("T", " ").slice(0, 16)));
    button.append(meta);
    list.append(button);
  }
  document.getElementById("queue-total").textContent = "共 " + total + " 个根问题";
}

async function loadQueue() {
  setNotice("");
  try {
    const data = await api("/review/api/queue?status=" + encodeURIComponent(state.status) + "&limit=50&offset=0");
    renderQueue(data.items || [], data.total || 0);
  } catch (error) {
    document.getElementById("queue").textContent = "队列加载失败：" + error.message;
  }
}

function renderOccurrence(row) {
  const box = node("div", "occurrence");
  const head = node("div", "meta");
  head.append(node("span", "badge", row.source || "unknown"));
  if (row.message_id) head.append(node("span", "", "消息 #" + row.message_id));
  if (row.conversation_id) head.append(node("span", "", "会话 #" + row.conversation_id));
  if (row.last_seen_at) head.append(node("span", "", row.last_seen_at.replace("T", " ").slice(0, 16)));
  box.append(head);
  box.append(node("div", "", row.reason || "（未记录原因）"));
  const citations = row.citations || [];
  if (!citations.length) {
    box.append(node("div", "muted", row.citations === null ? "无引用快照" : "引用为空"));
  }
  for (const citation of citations) {
    const snippet = node("div", "snippet");
    const title = citation.title || citation.chunk_id || citation.n || "片段";
    snippet.append(node("strong", "", "[" + title + "] "));
    snippet.append(document.createTextNode(citation.answer || citation.text || citation.content || ""));
    box.append(snippet);
  }
  if (row.comment) box.append(node("div", "muted", "用户评论：" + row.comment));
  return box;
}

function renderDetail(data) {
  const panel = document.getElementById("detail");
  panel.replaceChildren();
  panel.className = "";
  if (data.redirected_from !== null && data.redirected_from !== undefined) {
    panel.append(node("p", "muted", "从子行 #" + data.redirected_from + " 重定向到根问题 #" + data.id));
  }
  const title = node("h2", "", "#" + data.id + " " + (data.raw_question || ""));
  title.style.fontSize = "16px";
  panel.append(title);
  const meta = node("div", "meta");
  meta.append(node("span", "badge", data.status || ""));
  meta.append(node("span", "", "出现 " + data.duplicate_count + " 次"));
  panel.append(meta);

  const evidence = node("div", "evidence " + (data.evidence_state || "missing"), evidenceText(data.evidence_state));
  panel.append(evidence);

  panel.append(node("h3", "", "问题变体"));
  const variants = node("ul", "");
  for (const variant of data.variants || []) variants.append(node("li", "", variant));
  panel.append(variants);

  panel.append(node("h3", "", "出现记录"));
  for (const row of data.occurrences || []) panel.append(renderOccurrence(row));

  if (data.knowledge_chunk) {
    panel.append(node("h3", "", "关联知识块"));
    panel.append(node("p", "", "#" + data.knowledge_chunk.id + " · " + data.knowledge_chunk.vectorize_status + " · 向量 " + (data.knowledge_chunk.vector_id || "未写入")));
  }

  panel.append(node("h3", "", "补答入库"));
  const form = node("div", "");
  const questionRow = node("div", "form-row");
  const question = node("input", "");
  question.id = "answer-question";
  question.placeholder = "问题（留空沿用根问题）";
  questionRow.append(question);
  form.append(questionRow);
  const answerRow = node("div", "form-row");
  const answer = node("textarea", "");
  answer.id = "answer-text";
  answer.placeholder = "人工答案：写清适用条件与时效";
  answerRow.append(answer);
  form.append(answerRow);
  const categoryRow = node("div", "form-row");
  const category = node("input", "");
  category.id = "answer-category";
  category.placeholder = "分类（默认 人工补充）";
  categoryRow.append(category);
  form.append(categoryRow);
  const actions = node("div", "actions");
  const submit = node("button", "", "补答并入库");
  submit.addEventListener("click", submitAnswer);
  actions.append(submit);
  const ignore = node("button", "danger", "驳回");
  ignore.addEventListener("click", () => resolve("ignore"));
  actions.append(ignore);
  const reopen = node("button", "", "重开");
  reopen.addEventListener("click", () => resolve("reopen"));
  actions.append(reopen);
  const vectorize = node("button", "", "补向量化");
  vectorize.addEventListener("click", vectorizePending);
  actions.append(vectorize);
  form.append(actions);
  panel.append(form);
}

async function loadDetail(id) {
  setNotice("");
  try {
    const data = await api("/review/api/clusters/" + id);
    state.selected = data.id;
    state.detail = data;
    renderDetail(data);
  } catch (error) {
    const suffix = error.orphanId ? "（孤儿行 #" + error.orphanId + "）" : "";
    setNotice("详情加载失败：" + error.message + suffix, true);
  }
}

async function submitAnswer() {
  if (state.selected === null) return;
  const question = document.getElementById("answer-question").value;
  const answer = document.getElementById("answer-text").value;
  const category = document.getElementById("answer-category").value || "人工补充";
  try {
    const result = await api("/review/api/clusters/" + state.selected + "/answer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: question || null, answer: answer, category: category }),
    });
    const tail = result.vectorized ? "已写入 Milvus" : "chunk 仍为 pending，可稍后补向量化";
    setNotice("补答成功，知识块 #" + result.knowledge_chunk_id + "，" + tail);
    await loadQueue();
    await loadDetail(state.selected);
    await loadMetrics();
  } catch (error) {
    setNotice("补答失败：" + error.message, true);
  }
}

async function resolve(kind) {
  if (state.selected === null) return;
  const resolution = window.prompt(kind === "ignore" ? "驳回原因" : "重开原因");
  if (!resolution) return;
  const endpoint = kind === "ignore" ? "/ignore" : "/reopen";
  try {
    await api("/review/api/clusters/" + state.selected + endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ resolution: resolution }),
    });
    setNotice(kind === "ignore" ? "已驳回" : "已重开");
    await loadQueue();
    await loadDetail(state.selected);
    await loadMetrics();
  } catch (error) {
    setNotice("操作失败：" + error.message, true);
  }
}

async function vectorizePending() {
  try {
    const result = await api("/review/api/vectorize", { method: "POST" });
    setNotice("已补向量化 " + result.vectorized + " 条");
    if (state.selected !== null) await loadDetail(state.selected);
    await loadMetrics();
  } catch (error) {
    setNotice("补向量化失败：" + error.message, true);
  }
}

async function loadMetrics() {
  const box = document.getElementById("metrics");
  box.replaceChildren();
  try {
    const data = await api("/review/api/metrics");
    box.append(node("h3", "", "池指标"));
    box.append(node("p", "", "总信号 " + data.total_signals + " · 根问题 " + data.root_total));
    const statusLine = Object.entries(data.status_counts || {}).map(([k, v]) => k + " " + v).join(" · ");
    const sourceLine = Object.entries(data.source_counts || {}).map(([k, v]) => k + " " + v).join(" · ");
    box.append(node("p", "muted", "状态：" + (statusLine || "无")));
    box.append(node("p", "muted", "来源：" + (sourceLine || "无")));
  } catch (error) {
    box.append(node("p", "muted", "指标加载失败：" + error.message));
  }
}

document.getElementById("tabs").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-status]");
  if (!button) return;
  state.status = button.dataset.status;
  for (const item of event.currentTarget.querySelectorAll("button[data-status]")) {
    item.classList.toggle("active", item === button);
  }
  loadQueue();
});
document.getElementById("refresh").addEventListener("click", () => { loadQueue(); loadMetrics(); });

loadQueue();
loadMetrics();
</script>
</body>
</html>
