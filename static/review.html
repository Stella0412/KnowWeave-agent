<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知序 · 数据飞轮待审队列</title>
<style>
  :root { color-scheme: light; --line:#d8dee9; --muted:#667085; --accent:#2563eb; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; color:#1f2937; background:#f7f8fa; }
  header { display:flex; align-items:center; gap:16px; padding:12px 20px; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  header a { color:var(--accent); text-decoration:none; }
  main { display:grid; grid-template-columns:minmax(420px,1.1fr) minmax(320px,1fr); gap:16px; padding:16px 20px 40px; }
  section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:14px; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:6px; padding:5px 10px; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:#b42318; }
  button:disabled { opacity:.55; cursor:default; }
  .queue-item { width:100%; margin-bottom:8px; padding:10px; border:1px solid var(--line); border-radius:8px; }
  .queue-content { display:grid; grid-template-columns:minmax(0,1fr) minmax(100px,.9fr); gap:12px; }
  .queue-select { text-align:left; min-width:0; border:0; padding:0; }
  .answer-preview { color:var(--muted); font-size:12px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .review-gates { margin:16px 20px 0; padding:12px 16px; border:1px dashed #98a2b3; border-radius:8px; background:#fffcf5; line-height:1.9; }
  .review-gates b { color:#92400e; }
  button.approve { color:#067647; background:#ecfdf3; }
  dialog { width:min(1080px,94vw); max-height:90vh; overflow:auto; border:1px solid var(--line); border-radius:12px; padding:24px; }
  dialog::backdrop { background:rgba(16,24,40,.45); }
  dialog textarea { min-height:240px; }
  #approval-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,.9fr); gap:20px; }
  #approval-evidence { background:#f8fafc; padding:14px; border-radius:8px; max-height:65vh; overflow:auto; }
  .source-text { white-space:pre-wrap; overflow-wrap:anywhere; font-size:13px; }
  .source-card { border-bottom:1px solid var(--line); padding:10px 0; }
  .source-card summary { cursor:pointer; font-weight:600; }
  .mode-note { margin:8px 0 14px; color:#667085; }
  @media (max-width:760px) { #approval-layout { grid-template-columns:1fr; } #approval-evidence { max-height:35vh; } }
  .queue-item .actions { margin-bottom:0; }
  .queue-item .summary { display:block; font-weight:600; margin-bottom:4px; }
  .meta { color:var(--muted); font-size:12px; display:flex; gap:8px; flex-wrap:wrap; }
  .badge { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:0 7px; font-size:12px; }
  .evidence { border-radius:6px; padding:8px 10px; margin:8px 0; }
  .evidence.has_snippets { background:#ecfdf3; border:1px solid #abefc6; }
  .evidence.empty { background:#fffaeb; border:1px solid #fedf89; }
  .evidence.missing { background:#f2f4f7; border:1px solid #d0d5dd; }
  .occurrence { border-top:1px solid var(--line); padding:10px 0; }
  .snippet { background:#f8fafc; border-left:3px solid var(--line); padding:6px 8px; margin:6px 0; white-space:pre-wrap; }
  textarea, input, select { width:100%; font:inherit; padding:7px 8px; border:1px solid var(--line); border-radius:6px; }
  textarea { min-height:88px; resize:vertical; }
  .form-row { margin-bottom:8px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  #notice { min-height:22px; margin:8px 0; color:var(--muted); white-space:pre-wrap; }
  #metrics { margin-top:14px; border-top:1px solid var(--line); padding-top:10px; }
  .muted { color:var(--muted); }
  @media (max-width:860px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>数据飞轮 · 待审队列</h1>
  <a href="/">聊天页</a>
  <a href="/topics">主题分布</a>
  <a href="/admin">后台管理</a>
  <a href="/observability">观测与成本</a>
  <button id="refresh">刷新</button>
</header>
<aside class="review-gates" aria-label="审核三道闸">
  审核前先过三道闸：<b>① 垃圾过滤</b> 乱输入、测试胡打、不当言论 → 驳回；
  <b>② 时效</b> 活动截止等补了就过期的问题 → 驳回；
  <b>③ 频次</b> 低频冷门、暂不值得沉淀的问题 → 驳回。
  剩下的才是缺少的知识，请核准修订 AI 建议答案后通过。
  <div class="muted">已驳回的问题再次被问到只累加次数，不会自动回到待审；确需恢复时由审核人手动重开。</div>
</aside>
<main>
  <section>
    <div class="toolbar" id="tabs">
      <button data-status="待处理" class="active">待处理</button>
      <button data-status="已关闭">已关闭</button>
      <button data-status="已忽略">已驳回</button>
    </div>
    <div id="queue" class="muted">加载中…</div>
    <div id="queue-total" class="meta"></div>
  </section>
  <section id="detail-panel">
    <div id="notice"></div>
    <div id="detail" class="muted">从左侧选择一条问题。</div>
    <div id="metrics"></div>
  </section>
</main>
<dialog id="approval-dialog" aria-labelledby="approval-title">
  <h2 id="approval-title">通过并写回知识库</h2>
  <p class="muted">以下为 AI 建议草稿，请核实适用条件、事实与时效，在此基础上核准修订。</p>
  <div id="approval-layout"><div id="approval-form"></div><aside id="approval-evidence" aria-label="建议答案依据"></aside></div>
  <p id="approval-error" role="alert" class="danger"></p>
</dialog>
<script>
"use strict";

const state = { status: "待处理", selected: null, detail: null, approving: false };

function node(tag, className, text) {
  const item = document.createElement(tag);
  if (className) item.className = className;
  if (text !== undefined && text !== null) item.textContent = String(text);
  return item;
}

function setNotice(text, error) {
  const box = document.getElementById("notice");
  box.textContent = text || "";
  box.style.color = error ? "#b42318" : "";
}

async function api(path, options) {
  const response = await fetch(path, options);
  let body = null;
  try { body = await response.json(); } catch (_) { body = null; }
  if (!response.ok) {
    const detail = body && (body.detail || body.error) || ("HTTP " + response.status);
    const error = new Error(detail);
    error.status = response.status;
    error.orphanId = body && body.orphan_id;
    error.rootId = body && body.root_id;
    throw error;
  }
  return body;
}

function evidenceText(value) {
  if (value === "has_snippets") return "有引用片段：知识库检到了内容，但回答没过门槛。";
  if (value === "empty") return "引用为空：这一轮走了检索，但没有可用片段。";
  if (value === "missing") return "没有引用快照：这一轮没有走检索，无法判断是否缺知识。";
  return "未知证据状态：" + String(value);
}

function renderQueue(items, total) {
  const list = document.getElementById("queue");
  list.replaceChildren();
  list.className = "";
  if (!items.length) {
    list.append(node("p", "muted", "当前状态下没有待审问题。"));
  }
  for (const item of items) {
    const row = node("div", "queue-item");
    const content = node("div", "queue-content");
    const button = node("button", "queue-select");
    button.addEventListener("click", () => loadDetail(item.id));
    button.append(node("span", "summary", item.normalized_question || item.raw_question || "（空问题）"));
    const preview = node("span", "answer-preview", item.suggested_answer ? "AI 建议：" + item.suggested_answer : "AI 建议生成中，可稍后刷新");
    preview.title = item.suggested_answer || "";
    content.append(button, preview);
    const meta = node("span", "meta");
    meta.append(node("span", "badge", "出现 " + item.duplicate_count + " 次"));
    meta.append(node("span", "", item.status === "已忽略" ? "已驳回" : (item.status || "")));
    const sources = Object.entries(item.sources || {})
      .map(([name, count]) => name + "×" + count).join(" · ");
    if (sources) meta.append(node("span", "", sources));
    if (item.last_seen_at) meta.append(node("span", "", "最近 " + item.last_seen_at.replace("T", " ").slice(0, 16)));
    button.append(meta);
    row.append(content);
    if (item.status === "待处理") {
      const actions = node("div", "actions");
      const approve = node("button", "approve", "通过");
      approve.addEventListener("click", () => openApproval(item.id, approve));
      const reject = node("button", "danger", "驳回");
      reject.addEventListener("click", async () => { const detail = await loadDetail(item.id); if (detail) await resolve("ignore"); });
      actions.append(approve, reject);
      row.append(actions);
    }
    list.append(row);
  }
  document.getElementById("queue-total").textContent = "共 " + total + " 个根问题";
}

async function loadQueue(silent = false) {
  if (!silent) setNotice("");
  try {
    const data = await api("/review/api/queue?status=" + encodeURIComponent(state.status) + "&limit=50&offset=0");
    renderQueue(data.items || [], data.total || 0);
  } catch (error) {
    document.getElementById("queue").textContent = "队列加载失败：" + error.message;
  }
}

function renderOccurrence(row) {
  const box = node("div", "occurrence");
  const head = node("div", "meta");
  head.append(node("span", "badge", row.source || "unknown"));
  if (row.message_id) head.append(node("span", "", "消息 #" + row.message_id));
  if (row.conversation_id) head.append(node("span", "", "会话 #" + row.conversation_id));
  if (row.last_seen_at) head.append(node("span", "", row.last_seen_at.replace("T", " ").slice(0, 16)));
  box.append(head);
  box.append(node("div", "", row.reason || "（未记录原因）"));
  const citations = row.citations || [];
  if (!citations.length) {
    box.append(node("div", "muted", row.citations === null ? "无引用快照" : "引用为空"));
  }
  for (const citation of citations) {
    const snippet = node("div", "snippet");
    const title = citation.title || citation.chunk_id || citation.n || "片段";
    snippet.append(node("strong", "", "[" + title + "] "));
    snippet.append(document.createTextNode(citation.answer || citation.text || citation.content || ""));
    box.append(snippet);
  }
  if (row.comment) box.append(node("div", "muted", "用户评论：" + row.comment));
  return box;
}

function renderApprovalEvidence(data) {
  const box = document.getElementById("approval-evidence");
  box.replaceChildren(node("h3", "", "建议答案依据"));
  box.append(node("p", "muted", "候选知识和查重结论仅供核对，不代表草稿中每句话都已获证实。请逐项核实事实、条件和时效。"));
  box.append(node("h4", "", "查重判断与待核实说明"));
  box.append(node("p", "source-text", data.match_reason || "暂无 AI 查重说明，请人工核实。"));
  if (data.matched_knowledge) {
    const knowledge = data.matched_knowledge;
    box.append(node("h4", "", "关联知识（当前版本） · #" + knowledge.id));
    box.append(node("p", "source-text", knowledge.question));
    box.append(node("p", "source-text", knowledge.answer));
    box.append(node("p", "muted", "来源：" + (knowledge.section_path || knowledge.category || "知识库") +
      (knowledge.updated_at ? " · 更新于 " + knowledge.updated_at.replace("T", " ").slice(0, 19) : "")));
  } else {
    box.append(node("p", "muted", data.matched_chunk_id ? "原匹配知识已不存在，不能复用或修订。" : "未找到明确匹配的知识，草稿需人工确认。"));
  }
  const saved = data.suggestion_evidence;
  if (saved) {
    box.append(node("h4", "", "生成时参考的知识候选"));
    const candidates = saved.knowledge_candidates || [];
    if (!candidates.length) box.append(node("p", "muted", "生成时没有知识候选。"));
    for (const item of candidates) {
      const card = node("details", "source-card");
      card.append(node("summary", "", "知识 #" + item.id + " · " + item.question));
      card.append(node("p", "source-text", item.answer));
      box.append(card);
    }
  } else {
    box.append(node("p", "muted", "此草稿生成于依据快照功能启用前，未保存当时的知识候选。上方展示的是关联知识当前版本。"));
  }
  box.append(node("h4", "", saved ? "生成时的检索引用原文" : "原问题的历史检索引用"));
  const citations = saved ? saved.retrieval_snapshot : ((data.occurrences || []).find(row => row.id === data.id) || {}).citations;
  if (!citations || !citations.length) {
    box.append(node("p", "muted", citations === null ? "没有检索快照，不能据此证明答案正确。" : "没有可用引用，请核实草稿后再入库。"));
  }
  for (const item of citations || []) {
    const card = node("details", "source-card");
    card.append(node("summary", "", item.title || item.section_path || ("引用知识 #" + (item.chunk_id || item.n || "未知"))));
    card.append(node("p", "source-text", item.answer || item.text || item.content || "（无正文）"));
    box.append(card);
  }
}

function renderDetail(data) {
  const panel = document.getElementById("detail");
  panel.replaceChildren();
  panel.className = "";
  if (data.redirected_from !== null && data.redirected_from !== undefined) {
    panel.append(node("p", "muted", "从子行 #" + data.redirected_from + " 重定向到根问题 #" + data.id));
  }
  const title = node("h2", "", "#" + data.id + " " + (data.raw_question || ""));
  title.style.fontSize = "16px";
  panel.append(title);
  const meta = node("div", "meta");
  meta.append(node("span", "badge", data.status === "已忽略" ? "已驳回" : (data.status || "")));
  meta.append(node("span", "", "出现 " + data.duplicate_count + " 次"));
  panel.append(meta);
  if (data.resolution) panel.append(node("p", "muted", "处置说明：" + data.resolution));

  const evidence = node("div", "evidence " + (data.evidence_state || "missing"), evidenceText(data.evidence_state));
  panel.append(evidence);

  panel.append(node("h3", "", "问题变体"));
  const variants = node("ul", "");
  for (const variant of data.variants || []) variants.append(node("li", "", variant));
  panel.append(variants);

  panel.append(node("h3", "", "出现记录"));
  for (const row of data.occurrences || []) panel.append(renderOccurrence(row));

  if (data.knowledge_chunk) {
    panel.append(node("h3", "", "关联知识块"));
    panel.append(node("p", "", "#" + data.knowledge_chunk.id + " · " + data.knowledge_chunk.vectorize_status + " · 向量 " + (data.knowledge_chunk.vector_id || "未写入")));
  }

  if (data.match_reason) panel.append(node("p", "muted", "AI 查重：" + data.match_reason + (data.matched_chunk_id ? " · 知识 #" + data.matched_chunk_id : "")));
  const approveDetail = node("button", "approve", "通过 · 核准修订建议答案");
  approveDetail.disabled = data.status !== "待处理";
  approveDetail.addEventListener("click", () => openApproval(data.id, approveDetail));
  panel.append(approveDetail);
  renderApprovalEvidence(data);
  const form = node("div", "");
  const modeLabel = node("label", "", "审核入库方式");
  modeLabel.htmlFor = "review-action";
  const mode = node("select", "");
  mode.id = "review-action";
  for (const [value, label] of [["reuse", "复用已有知识"], ["update", "修订已有知识"], ["new", "新增知识"]]) {
    const option = node("option", "", label);
    option.value = value;
    option.disabled = value !== "new" && !data.matched_knowledge;
    mode.append(option);
  }
  mode.value = data.matched_knowledge ? "reuse" : "new";
  const modeNote = node("p", "mode-note");
  form.append(modeLabel, mode, modeNote);
  const questionRow = node("div", "form-row");
  const question = node("input", "");
  question.id = "answer-question";
  question.placeholder = "标准化问题";
  question.value = data.normalized_question || data.raw_question || "";
  questionRow.append(node("label", "", "标准化问题"), question);
  form.append(questionRow);
  const answerRow = node("div", "form-row");
  const answer = node("textarea", "");
  answer.id = "answer-text";
  answer.placeholder = "建议生成失败时可重试，或人工补充已核实的答案";
  answer.value = data.suggested_answer || "";
  answerRow.append(node("label", "", "核准后的答案"), answer);
  form.append(answerRow);
  const categoryRow = node("div", "form-row");
  const category = node("input", "");
  category.id = "answer-category";
  category.placeholder = "分类（默认 人工补充）";
  categoryRow.append(node("label", "", "知识分类"), category);
  form.append(categoryRow);
  const actions = node("div", "actions");
  const submit = node("button", "approve", "确认通过");
  submit.id = "approve-submit";
  submit.addEventListener("click", submitAnswer);
  const drafts = {};
  let previousMode = null;
  function changeMode() {
    if (previousMode) drafts[previousMode] = { question: question.value, answer: answer.value, category: category.value };
    const value = mode.value;
    const matched = data.matched_knowledge;
    const defaults = value === "new"
      ? { question: data.normalized_question || data.raw_question || "", answer: data.suggested_answer || "", category: "人工补充" }
      : { question: matched.question, answer: value === "reuse" ? matched.answer : (data.suggested_answer || matched.answer), category: matched.category };
    const draft = drafts[value] || defaults;
    question.value = draft.question;
    answer.value = draft.answer;
    category.value = draft.category;
    for (const input of [question, answer, category]) input.disabled = value === "reuse";
    modeNote.textContent = value === "reuse" ? "直接关联已有知识，不创建重复内容，也不修改原答案。"
      : value === "update" ? "将修改右侧关联知识的原问题和答案，影响后续使用该知识的回答；确认后重新同步检索。"
      : "审核后创建独立知识。若右侧已有同义答案，建议优先复用。";
    submit.textContent = value === "reuse" ? "确认复用并通过" : value === "update" ? "确认修订并通过" : "确认新增并通过";
    previousMode = value;
  }
  mode.addEventListener("change", changeMode);
  changeMode();
  actions.append(submit);
  const ignore = node("button", "danger", "驳回");
  ignore.addEventListener("click", () => resolve("ignore"));
  if (data.status === "待处理") panel.append(ignore);
  const reopen = node("button", "", "重开");
  reopen.addEventListener("click", () => resolve("reopen"));
  if (data.status !== "待处理") panel.append(reopen);
  const vectorize = node("button", "", "补向量化");
  vectorize.addEventListener("click", vectorizePending);
  panel.append(vectorize);
  const cancel = node("button", "", "取消");
  cancel.addEventListener("click", () => document.getElementById("approval-dialog").close());
  actions.append(cancel);
  form.append(actions);
  document.getElementById("approval-form").replaceChildren(form);
}

async function loadDetail(id) {
  setNotice("");
  try {
    const data = await api("/review/api/clusters/" + id);
    state.selected = data.id;
    state.detail = data;
    renderDetail(data);
    return data;
  } catch (error) {
    const suffix = error.orphanId ? "（孤儿行 #" + error.orphanId + "）" : "";
    setNotice("详情加载失败：" + error.message + suffix, true);
  }
}

async function openApproval(id, trigger) {
  if (state.approving) return;
  state.approving = true;
  trigger.disabled = true;
  try {
    let data = await loadDetail(id);
    if (!data || data.status !== "待处理") return;
    if (!data.suggested_answer) {
      setNotice("正在生成标准化问题、查重结果与建议答案…");
      try {
        await api("/review/api/clusters/" + id + "/suggestion", { method: "POST" });
        data = await loadDetail(id);
        if (!data || data.status !== "待处理") return;
      } catch (error) { setNotice(error.message + "；可人工补充或取消后重试。", true); }
    }
    state.selected = data.id;
    state.detail = data;
    renderDetail(data);
    document.getElementById("approval-error").textContent = "";
    document.getElementById("approval-dialog").showModal();
  } finally { trigger.disabled = false; state.approving = false; }
}

async function submitAnswer() {
  if (state.selected === null) return;
  const question = document.getElementById("answer-question").value;
  const answer = document.getElementById("answer-text").value;
  const category = document.getElementById("answer-category").value || "人工补充";
  const action = document.getElementById("review-action").value;
  const target = state.detail.matched_knowledge;
  if (action !== "reuse" && !answer.trim()) {
    document.getElementById("approval-error").textContent = "请核准并填写答案后再通过。";
    return;
  }
  const submit = document.getElementById("approve-submit");
  submit.disabled = true;
  try {
    const result = await api("/review/api/clusters/" + state.selected + "/answer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: question || null, answer: answer, category: category, action,
        target_chunk_id: action === "new" ? null : target.id,
        expected_signature: action === "new" ? null : target.signature }),
    });
    document.getElementById("approval-dialog").close();
    const tail = result.vectorized ? "检索已生效" : "待同步检索，可稍后补充同步";
    const actionName = { reuse: "已复用", update: "已修订", new: "已新增" }[result.action] || "已通过";
    await loadQueue(true);
    setNotice(actionName + "知识 #" + result.knowledge_chunk_id + "，" + tail);
    await loadDetail(state.selected);
    await loadMetrics();
  } catch (error) {
    document.getElementById("approval-error").textContent = "入库失败：" + error.message;
  } finally { submit.disabled = false; }
}

async function resolve(kind) {
  if (state.selected === null) return;
  const resolution = window.prompt(kind === "ignore" ? "驳回原因（垃圾过滤 / 时效 / 频次 / 其他，请补充说明）" : "重开原因");
  if (!resolution) return;
  const endpoint = kind === "ignore" ? "/ignore" : "/reopen";
  try {
    await api("/review/api/clusters/" + state.selected + endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ resolution: resolution }),
    });
    setNotice(kind === "ignore" ? "已驳回" : "已重开");
    await loadQueue();
    await loadDetail(state.selected);
    await loadMetrics();
  } catch (error) {
    setNotice("操作失败：" + error.message, true);
  }
}

async function vectorizePending() {
  try {
    const result = await api("/review/api/vectorize", { method: "POST" });
    setNotice("已补向量化 " + result.vectorized + " 条");
    if (state.selected !== null) await loadDetail(state.selected);
    await loadMetrics();
  } catch (error) {
    setNotice("补向量化失败：" + error.message, true);
  }
}

async function loadMetrics() {
  const box = document.getElementById("metrics");
  box.replaceChildren();
  try {
    const data = await api("/review/api/metrics");
    box.append(node("h3", "", "池指标"));
    box.append(node("p", "", "总信号 " + data.total_signals + " · 根问题 " + data.root_total));
    const statusLine = Object.entries(data.status_counts || {}).map(([k, v]) => k + " " + v).join(" · ");
    const sourceLine = Object.entries(data.source_counts || {}).map(([k, v]) => k + " " + v).join(" · ");
    box.append(node("p", "muted", "状态：" + (statusLine || "无")));
    box.append(node("p", "muted", "来源：" + (sourceLine || "无")));
  } catch (error) {
    box.append(node("p", "muted", "指标加载失败：" + error.message));
  }
}

document.getElementById("tabs").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-status]");
  if (!button) return;
  state.status = button.dataset.status;
  for (const item of event.currentTarget.querySelectorAll("button[data-status]")) {
    item.classList.toggle("active", item === button);
  }
  loadQueue();
});
document.getElementById("refresh").addEventListener("click", () => { loadQueue(); loadMetrics(); });

loadQueue();
loadMetrics();
setInterval(() => {
  if (!document.hidden && !state.approving && !document.getElementById("approval-dialog").open) loadQueue(true);
}, 15000);
</script>
</body>
</html>
